metadata:
  name: declarative-bad-config
  namespace: declarative-test
spec:
  manifest:
    type: PIPELINE_MANIFEST_TYPE_DECLARATIVE
    content:
      schemaVersion: v1alpha1
      tasks:
        a: {taskFunction: mock/python, config: {entry_point: a.py, timeout_seconds: 600}}
