apiVersion: michelangelo.api/v2
kind: Pipeline
metadata:
  name: declarative-hello
  namespace: declarative-test
spec:
  description: Three tasks in a chain
  manifest:
    type: PIPELINE_MANIFEST_TYPE_DECLARATIVE
    content:
      schemaVersion: v1alpha1
      tasks:
        extract:
          taskFunction: mock/python
          config: {entry_point: extract.py}
        transform:
          taskFunction: mock/python
          config: {entry_point: transform.py, args: ["--input", "{{ tasks.extract.output.path }}"]}
          dependsOn: [{task: extract}]
        load:
          taskFunction: mock/python
          config: {entry_point: load.py}
          jobSpecs: {cpu: 2, memory: 4Gi}
          dependsOn: [{task: transform}]
