# Namespace-compatible, single-node adaptation of the BERT/CoLA training example.
apiVersion: michelangelo.api/v2
kind: Pipeline
metadata:
  namespace: default
  name: bert-cola-test
  annotations:
    michelangelo/uniflow-image: ghcr.io/michelangelo-ai/examples:main
spec:
  type: PIPELINE_TYPE_TRAIN
  manifest:
    filePath: examples.retrain_example.training
