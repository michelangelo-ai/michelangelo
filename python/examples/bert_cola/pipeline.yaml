apiVersion: michelangelo.api/v2
kind: Pipeline
metadata:
  namespace: "ma-dev-test"
  name: "bert-cola-test"
  annotations:
    michelangelo/uniflow-image: ghcr.io/michelangelo-ai/examples:fix-pipeline-type-filter-selector
spec:
  type: "PIPELINE_TYPE_TRAIN"
  manifest:
    filePath: examples.bert_cola.bert_cola
    triggerMap:
      monthly-run:
        cronSchedule:
          cron: "0 0 1 * *"
        maxConcurrency: 1
        parametersMap:
          cola-monthly:
            kwArgs:
              path: 'nyu-mll/glue'
              name: 'cola'
              tokenizer_max_length: 128
