# Source of the core-v0.1.0 interpreter release. Build it with
# python -m michelangelo.uniflow.declarative.assemble. Paths are relative to
# the repository root.
version: core-v0.1.0
artifact: s3://default/interpreters/core-v0.1.0.tar.gz
task_types:
  core/ray:
    factory: python/michelangelo/uniflow/plugins/ray/task.star:task
    job_specs_key: ray
    capabilities: [retry]
    config:
      entry_point: {type: string, required: true}
      args: {type: list}
      kwargs: {type: dict}
    job_specs:
      ray:
        head_cpu: {type: integer}
        worker_instances: {type: integer}
