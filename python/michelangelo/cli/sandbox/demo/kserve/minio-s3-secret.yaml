# MinIO S3 credentials for KServe's storage-initializer.
#
# KServe's storage-initializer downloads storageUri directly (no AWS SDK
# config file), so a non-AWS S3 endpoint (MinIO) must be described via the
# serving.kserve.io/s3-* annotations on a Secret, referenced by a
# ServiceAccount that the InferenceService's predictor uses.
#
# MinIO here runs in the sandbox cluster (k3d-michelangelo-sandbox) and is
# reached from compute-1 via host.docker.internal, same cross-cluster
# pattern used elsewhere in this demo dir.
#
# Apply to compute cluster:
#   kubectl --context k3d-michelangelo-compute-1 apply -f minio-s3-secret.yaml
#
# Reference from an InferenceServer CR via the annotation:
#   michelangelo/kserve-service-account: kserve-minio-sa

apiVersion: v1
kind: Secret
metadata:
  name: kserve-minio-secret
  namespace: default
  annotations:
    serving.kserve.io/s3-endpoint: host.docker.internal:9091
    serving.kserve.io/s3-usehttps: "0"
    serving.kserve.io/s3-verifyssl: "0"
    serving.kserve.io/s3-useanoncredential: "false"
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: minioadmin
  AWS_SECRET_ACCESS_KEY: minioadmin
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kserve-minio-sa
  namespace: default
secrets:
  - name: kserve-minio-secret
