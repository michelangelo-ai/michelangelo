apiVersion: michelangelo.api/v2
kind: InferenceServer
metadata:
  name: inference-server-example
  namespace: default
  labels:
    app: inference-server
spec:
  tenancyType: TENANCY_TYPE_DEDICATED
  backendType: BACKEND_TYPE_TRITON
  ownerSpec:
    tier: 1
  initSpec:
    resourceSpec:
      cpu: 2
      memory: "4Gi"
    servingSpec:
      version: "latest"
      # No uri, so the operator-configured default image applies. The pull
      # secret is still needed because that default lives in a private
      # registry; `ma sandbox demo` creates it from local GitHub credentials.
      image:
        imagePullSecrets:
          - ghcr-triton-pull
    numInstances: 1
  decomSpec:
    decommission: false
  owner:
    name: "user-example"
  clusterTargets:
  - clusterId: michelangelo-sandbox
    kubernetes:
      host: https://kubernetes.default.svc
      port: "443"
      tokenTag: cluster-michelangelo-sandbox-is-token
      caDataTag: cluster-michelangelo-sandbox-ca-data
