            {
              "expr": "histogram_quantile(0.99, sum by(controller, le) (rate(controller_runtime_reconcile_time_seconds_bucket[5m])))",
              "legendFormat": "{{controller}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          }
        },
        {
          "id": 6,
