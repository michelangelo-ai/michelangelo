---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-model-serving
data:
  model-serving.json: |
    {
      "id": null,
      "uid": "model-serving",
      "title": "Model Serving",
      "tags": [
        "michelangelo",
        "triton",
        "model-serving"
      ],
      "style": "dark",
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "10s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "inference_server",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "Prometheus"
            },
            "query": "label_values(nv_inference_count, inference_server)",
            "includeAll": true,
            "multi": true,
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "refresh": 2
          },
          {
            "name": "model",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "Prometheus"
            },
            "query": "label_values(nv_inference_count{inference_server=~\"$inference_server\"}, model)",
            "includeAll": true,
            "multi": true,
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "refresh": 2
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Request Volume & Success",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 2,
          "title": "Inference Request Rate by Model",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "targets": [
            {
              "expr": "sum by(model, version) (rate(nv_inference_count{inference_server=~\"$inference_server\", model=~\"$model\"}[5m]))",
              "legendFormat": "{{model}} v{{version}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "title": "Inference Success vs Failure Rate",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "targets": [
            {
              "expr": "sum by(model) (rate(nv_inference_request_success{inference_server=~\"$inference_server\", model=~\"$model\"}[5m]))",
              "legendFormat": "{{model}} - success",
              "refId": "A"
            },
            {
              "expr": "sum by(model) (rate(nv_inference_request_failure{inference_server=~\"$inference_server\", model=~\"$model\"}[5m]))",
              "legendFormat": "{{model}} - failure",
              "refId": "B"
            }
          ]
        },
        {
          "id": 4,
          "title": "Execution Count by Model",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 9 },
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "targets": [
            {
              "expr": "sum by(model) (rate(nv_inference_exec_count{inference_server=~\"$inference_server\", model=~\"$model\"}[5m]))",
              "legendFormat": "{{model}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "title": "Pending Request Count by Model",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 9 },
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "targets": [
            {
              "expr": "nv_inference_pending_request_count{inference_server=~\"$inference_server\", model=~\"$model\"}",
              "legendFormat": "{{model}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 6,
          "type": "row",
          "title": "Latency",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 17 },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 7,
          "title": "Avg Request Duration by Model (ms)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 18 },
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "targets": [
            {
              "expr": "sum by(model) (rate(nv_inference_request_duration_us{inference_server=~\"$inference_server\", model=~\"$model\"}[5m])) / sum by(model) (rate(nv_inference_count{inference_server=~\"$inference_server\", model=~\"$model\"}[5m])) / 1000",
              "legendFormat": "{{model}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "ms" },
            "overrides": []
          }
        },
        {
          "id": 8,
          "title": "Avg Compute Duration Breakdown by Model (ms)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 18 },
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "targets": [
            {
              "expr": "sum by(model) (rate(nv_inference_compute_input_duration_us{inference_server=~\"$inference_server\", model=~\"$model\"}[5m])) / sum by(model) (rate(nv_inference_count{inference_server=~\"$inference_server\", model=~\"$model\"}[5m])) / 1000",
              "legendFormat": "{{model}} - input",
              "refId": "A"
            },
            {
              "expr": "sum by(model) (rate(nv_inference_compute_infer_duration_us{inference_server=~\"$inference_server\", model=~\"$model\"}[5m])) / sum by(model) (rate(nv_inference_count{inference_server=~\"$inference_server\", model=~\"$model\"}[5m])) / 1000",
              "legendFormat": "{{model}} - infer",
              "refId": "B"
            },
            {
              "expr": "sum by(model) (rate(nv_inference_compute_output_duration_us{inference_server=~\"$inference_server\", model=~\"$model\"}[5m])) / sum by(model) (rate(nv_inference_count{inference_server=~\"$inference_server\", model=~\"$model\"}[5m])) / 1000",
              "legendFormat": "{{model}} - output",
              "refId": "C"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "ms" },
            "overrides": []
          }
        },
        {
          "id": 9,
          "title": "Avg Queue Duration by Model (ms)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 26 },
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "targets": [
            {
              "expr": "sum by(model) (rate(nv_inference_queue_duration_us{inference_server=~\"$inference_server\", model=~\"$model\"}[5m])) / sum by(model) (rate(nv_inference_count{inference_server=~\"$inference_server\", model=~\"$model\"}[5m])) / 1000",
              "legendFormat": "{{model}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "ms" },
            "overrides": []
          }
        },
        {
          "id": 10,
          "title": "Model (Re)load Duration (s)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 26 },
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "targets": [
            {
              "expr": "nv_model_load_duration_secs{inference_server=~\"$inference_server\", model=~\"$model\"}",
              "legendFormat": "{{model}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "s" },
            "overrides": []
          }
        },
        {
          "id": 11,
          "type": "row",
          "title": "Server Resource Usage",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 34 },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 12,
          "title": "CPU Utilization by Server",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 35 },
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "targets": [
            {
              "expr": "nv_cpu_utilization{inference_server=~\"$inference_server\"}",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "percentunit" },
            "overrides": []
          }
        },
        {
          "id": 13,
