          },
          {
            "id": 16,
            "title": "p99 Workqueue Work Duration by Controller",
            "type": "timeseries",
            "gridPos": {
              "h": 8,
              "w": 12,
              "x": 12,
              "y": 50
            },
            "datasource": {
              "type": "prometheus",
              "uid": "Prometheus"
            },
            "targets": [
              {
                "expr": "histogram_quantile(0.99, sum by(controller, le) (rate(workqueue_work_duration_seconds_bucket[5m])))",
                "legendFormat": "{{controller}}",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "s"
              },
              "overrides": []
            }
          },
          {
            "id": 17,
            "title": "Workqueue Longest Running Processor (s) by Controller",
            "type": "timeseries",
            "gridPos": {
              "h": 8,
              "w": 24,
              "x": 0,
              "y": 58
            },
            "datasource": {
              "type": "prometheus",
              "uid": "Prometheus"
            },
            "targets": [
              {
                "expr": "workqueue_longest_running_processor_seconds",
                "legendFormat": "{{controller}}",
                "refId": "A"
              }
            ],
            "fieldConfig": {
