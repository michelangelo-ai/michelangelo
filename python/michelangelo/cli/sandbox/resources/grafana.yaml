---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
    - name: Prometheus
      uid: Prometheus
      type: prometheus
      access: proxy
      url: http://prometheus:9090
      isDefault: true

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-crd-metrics
data:
  crd-metrics.json: |
    {
      "dashboard": {
        "id": null,
        "title": "Michelangelo CRD Metrics",
        "tags": ["michelangelo", "kubernetes", "crd"],
        "style": "dark",
        "timezone": "browser",
        "panels": [
          {
            "id": 1,
            "title": "CRD Unmarshal Errors",
            "type": "stat",
            "targets": [
              {
                "expr": "sum(rate(crd_unmarshal_errors_resource_type_Pipeline_field_type_spec_error_type_unmarshal_error[5m]))",
                "legendFormat": "Pipeline Spec Errors"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "color": {
                  "mode": "thresholds"
                },
                "thresholds": {
                  "steps": [
                    {"color": "green", "value": 0},
                    {"color": "yellow", "value": 0.1},
                    {"color": "red", "value": 1}
                  ]
                }
              }
            },
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0}
          },
          {
            "id": 2,
            "title": "CRD Unmarshal Error Rate by Resource Type",
            "type": "timeseries",
            "targets": [
              {
                "expr": "rate(crd_unmarshal_errors_resource_type_Pipeline_field_type_spec_error_type_unmarshal_error[5m])",
                "legendFormat": "Pipeline Spec"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0}
          },
          {
            "id": 3,
            "title": "Total CRD Unmarshal Errors by Resource",
            "type": "table",
            "targets": [
              {
                "expr": "crd_unmarshal_errors_resource_type_Pipeline_field_type_spec_error_type_unmarshal_error",
                "format": "table"
              }
            ],
            "gridPos": {"h": 8, "w": 24, "x": 0, "y": 8}
          }
        ],
        "time": {
          "from": "now-1h",
          "to": "now"
        },
        "refresh": "5s"
      }
    }

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-controllermgr
data:
  controllermgr.json: |
    {
      "id": null,
      "uid": "adgpdn8",
      "title": "controllermgr",
      "tags": [
        "michelangelo",
        "controllermgr"
      ],
      "style": "dark",
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "10s",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Controller Reconciliation",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 2,
          "title": "Reconcile Rate by Controller & Result",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "Prometheus"
          },
          "targets": [
            {
              "expr": "sum by(controller, result) (rate(controller_runtime_reconcile_total[5m]))",
              "legendFormat": "{{controller}} - {{result}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "title": "Reconcile Error Rate by Controller",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "Prometheus"
          },
          "targets": [
            {
              "expr": "sum by(controller) (rate(controller_runtime_reconcile_errors_total[5m]))",
              "legendFormat": "{{controller}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "title": "Avg Reconcile Duration by Controller",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 9
          },
          "datasource": {
            "type": "prometheus",
            "uid": "Prometheus"
          },
          "targets": [
            {
              "expr": "sum by(controller) (rate(controller_runtime_reconcile_time_seconds_sum[5m])) / sum by(controller) (rate(controller_runtime_reconcile_time_seconds_count[5m]))",
              "legendFormat": "{{controller}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          }
        },
        {
          "id": 5,
