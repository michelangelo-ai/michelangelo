---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
    - name: Prometheus
      type: prometheus
      access: proxy
      url: http://prometheus:9090
      isDefault: true

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-crd-metrics
data:
  crd-metrics.json: |
    {
      "dashboard": {
        "id": null,
        "title": "Michelangelo CRD Metrics",
        "tags": ["michelangelo", "kubernetes", "crd"],
        "style": "dark",
        "timezone": "browser",
        "panels": [
          {
            "id": 1,
            "title": "CRD Unmarshal Errors",
            "type": "stat",
            "targets": [
              {
                "expr": "sum(rate(crd_unmarshal_errors_resource_type_Pipeline_field_type_spec_error_type_unmarshal_error[5m]))",
                "legendFormat": "Pipeline Spec Errors"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "color": {
                  "mode": "thresholds"
                },
                "thresholds": {
                  "steps": [
                    {"color": "green", "value": 0},
                    {"color": "yellow", "value": 0.1},
                    {"color": "red", "value": 1}
                  ]
                }
              }
            },
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0}
          },
          {
            "id": 2,
            "title": "CRD Unmarshal Error Rate by Resource Type",
            "type": "timeseries",
            "targets": [
              {
                "expr": "rate(crd_unmarshal_errors_resource_type_Pipeline_field_type_spec_error_type_unmarshal_error[5m])",
                "legendFormat": "Pipeline Spec"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0}
          },
          {
            "id": 3,
            "title": "Total CRD Unmarshal Errors by Resource",
            "type": "table",
            "targets": [
              {
                "expr": "crd_unmarshal_errors_resource_type_Pipeline_field_type_spec_error_type_unmarshal_error",
                "format": "table"
              }
            ],
            "gridPos": {"h": 8, "w": 24, "x": 0, "y": 8}
          }
        ],
        "time": {
          "from": "now-1h",
          "to": "now"
        },
        "refresh": "5s"
      }
    }

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-config
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
    - name: 'default'
      orgId: 1
      folder: ''
      type: file
      disableDeletion: false
      updateIntervalSeconds: 10
      allowUiUpdates: true
      options:
        path: /var/lib/grafana/dashboards

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        # Pinned to an explicit version (not `:latest`) so the sandbox doesn't
        # silently stick to whatever digest a node happened to cache first.
        # Bump manually when a CVE affecting this version is reported.
        image: grafana/grafana:13.1.1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        env:
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: "admin"
        - name: GF_INSTALL_PLUGINS
          value: "grafana-clock-panel,grafana-simple-json-datasource"
        volumeMounts:
        - name: grafana-storage
          mountPath: /var/lib/grafana
        - name: grafana-datasources
          mountPath: /etc/grafana/provisioning/datasources
        - name: grafana-dashboards-config
          mountPath: /etc/grafana/provisioning/dashboards
        - name: grafana-dashboard-crd-metrics
          mountPath: /var/lib/grafana/dashboards
        - name: grafana-dashboard-controllermgr
          mountPath: /var/lib/grafana/dashboards/controllermgr
      volumes:
      - name: grafana-storage
        emptyDir: {}
      - name: grafana-datasources
        configMap:
          name: grafana-datasources
      - name: grafana-dashboards-config
        configMap:
          name: grafana-dashboards-config
      - name: grafana-dashboard-crd-metrics
        configMap:
          name: grafana-dashboard-crd-metrics
      - name: grafana-dashboard-controllermgr
        configMap:
          name: grafana-dashboard-controllermgr

---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  selector:
    app: grafana
  ports:
  - name: grafana
    port: 3000
    targetPort: 3000
    nodePort: 30012
  type: NodePort

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-controllermgr
data:
  controllermgr.json: |
    {
      "dashboard": {
        "id": null,
        "title": "controllermgr",
        "tags": [
          "michelangelo",
          "controllermgr"
        ],
        "style": "dark",
        "timezone": "browser",
        "schemaVersion": 39,
        "refresh": "10s",
        "time": {
          "from": "now-24h",
          "to": "now"
        },
        "panels": [
          {
            "id": 1,
            "type": "row",
            "title": "Controller Reconciliation",
            "gridPos": {
              "h": 1,
              "w": 24,
              "x": 0,
              "y": 0
            },
            "collapsed": false,
            "panels": []
          },
          {
            "id": 2,
            "title": "Reconcile Rate by Controller & Result",
            "type": "timeseries",
            "gridPos": {
              "h": 8,
              "w": 12,
              "x": 0,
              "y": 1
            },
            "datasource": {
              "type": "prometheus",
              "uid": "Prometheus"
            },
            "targets": [
              {
                "expr": "sum by(controller, result) (rate(controller_runtime_reconcile_total[5m]))",
                "legendFormat": "{{controller}} - {{result}}",
                "refId": "A"
              }
            ]
          },
          {
            "id": 3,
            "title": "Reconcile Error Rate by Controller",
            "type": "timeseries",
            "gridPos": {
              "h": 8,
              "w": 12,
              "x": 12,
              "y": 1
            },
            "datasource": {
              "type": "prometheus",
              "uid": "Prometheus"
            },
            "targets": [
              {
                "expr": "sum by(controller) (rate(controller_runtime_reconcile_errors_total[5m]))",
                "legendFormat": "{{controller}}",
                "refId": "A"
              }
            ]
          },
          {
            "id": 4,
            "title": "Avg Reconcile Duration by Controller",
            "type": "timeseries",
            "gridPos": {
              "h": 8,
              "w": 12,
              "x": 0,
              "y": 9
            },
            "datasource": {
              "type": "prometheus",
              "uid": "Prometheus"
            },
            "targets": [
              {
                "expr": "sum by(controller) (rate(controller_runtime_reconcile_time_seconds_sum[5m])) / sum by(controller) (rate(controller_runtime_reconcile_time_seconds_count[5m]))",
                "legendFormat": "{{controller}}",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "s"
              },
              "overrides": []
            }
          },
          {
            "id": 5,
            "title": "p99 Reconcile Duration by Controller",
            "type": "timeseries",
            "gridPos": {
              "h": 8,
              "w": 12,
              "x": 12,
              "y": 9
            },
            "datasource": {
              "type": "prometheus",
              "uid": "Prometheus"
            },
            "targets": [
              {
                "expr": "histogram_quantile(0.99, sum by(controller, le) (rate(controller_runtime_reconcile_time_seconds_bucket[5m])))",
                "legendFormat": "{{controller}}",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "s"
              },
              "overrides": []
            }
          },
          {
            "id": 6,
            "title": "Active Workers by Controller",
            "type": "timeseries",
            "gridPos": {
              "h": 8,
              "w": 8,
              "x": 0,
              "y": 17
            },
            "datasource": {
              "type": "prometheus",
              "uid": "Prometheus"
            },
            "targets": [
              {
                "expr": "controller_runtime_active_workers",
                "legendFormat": "{{controller}}",
                "refId": "A"
              }
            ]
          },
          {
            "id": 7,
            "title": "Max Concurrent Reconciles by Controller",
            "type": "timeseries",
            "gridPos": {
              "h": 8,
              "w": 8,
              "x": 8,
              "y": 17
            },
            "datasource": {
              "type": "prometheus",
              "uid": "Prometheus"
            },
            "targets": [
              {
                "expr": "controller_runtime_max_concurrent_reconciles",
                "legendFormat": "{{controller}}",
                "refId": "A"
              }
            ]
          },
          {
            "id": 8,
            "title": "Reconcile Panics by Controller",
            "type": "timeseries",
            "gridPos": {
              "h": 8,
              "w": 8,
              "x": 16,
              "y": 17
            },
            "datasource": {
              "type": "prometheus",
              "uid": "Prometheus"
            },
            "targets": [
              {
                "expr": "sum by(controller) (rate(controller_runtime_reconcile_panics_total[5m]))",
                "legendFormat": "{{controller}}",
                "refId": "A"
              }
            ]
          },
          {
            "id": 9,
            "title": "Terminal Reconcile Errors by Controller",
            "type": "timeseries",
            "gridPos": {
              "h": 8,
              "w": 24,
              "x": 0,
              "y": 25
            },
            "datasource": {
              "type": "prometheus",
              "uid": "Prometheus"
            },
            "targets": [
              {
                "expr": "sum by(controller) (rate(controller_runtime_terminal_reconcile_errors_total[5m]))",
                "legendFormat": "{{controller}}",
                "refId": "A"
              }
            ]
          },
          {
            "id": 10,
            "type": "row",
            "title": "Workqueue",
            "gridPos": {
              "h": 1,
              "w": 24,
              "x": 0,
              "y": 33
            },
            "collapsed": false,
            "panels": []
          },
          {
            "id": 11,
            "title": "Workqueue Depth by Controller",
            "type": "timeseries",
            "gridPos": {
              "h": 8,
              "w": 12,
              "x": 0,
              "y": 34
            },
            "datasource": {
              "type": "prometheus",
              "uid": "Prometheus"
            },
            "targets": [
              {
                "expr": "workqueue_depth",
                "legendFormat": "{{controller}}",
                "refId": "A"
              }
            ]
          },
          {
            "id": 12,
            "title": "Workqueue Add Rate by Controller",
            "type": "timeseries",
            "gridPos": {
              "h": 8,
              "w": 12,
              "x": 12,
              "y": 34
            },
            "datasource": {
              "type": "prometheus",
              "uid": "Prometheus"
            },
            "targets": [
              {
                "expr": "sum by(controller) (rate(workqueue_adds_total[5m]))",
                "legendFormat": "{{controller}}",
                "refId": "A"
              }
            ]
          },
          {
            "id": 13,
            "title": "Workqueue Retry Rate by Controller",
            "type": "timeseries",
            "gridPos": {
              "h": 8,
              "w": 12,
              "x": 0,
              "y": 42
            },
            "datasource": {
              "type": "prometheus",
              "uid": "Prometheus"
            },
            "targets": [
              {
                "expr": "sum by(controller) (rate(workqueue_retries_total[5m]))",
                "legendFormat": "{{controller}}",
                "refId": "A"
              }
            ]
          },
          {
            "id": 14,
            "title": "Workqueue Unfinished Work (s) by Controller",
            "type": "timeseries",
            "gridPos": {
              "h": 8,
              "w": 12,
              "x": 12,
              "y": 42
            },
            "datasource": {
              "type": "prometheus",
              "uid": "Prometheus"
            },
            "targets": [
              {
                "expr": "workqueue_unfinished_work_seconds",
                "legendFormat": "{{controller}}",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "s"
              },
              "overrides": []
            }
          },
          {
            "id": 15,
            "title": "p99 Workqueue Queue Duration by Controller",
            "type": "timeseries",
            "gridPos": {
              "h": 8,
              "w": 12,
              "x": 0,
              "y": 50
            },
            "datasource": {
              "type": "prometheus",
              "uid": "Prometheus"
            },
            "targets": [
              {
                "expr": "histogram_quantile(0.99, sum by(controller, le) (rate(workqueue_queue_duration_seconds_bucket[5m])))",
                "legendFormat": "{{controller}}",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "s"
              },
              "overrides": []
