          }
        },
        {
          "id": 15,
          "title": "p99 Workqueue Queue Duration by Controller",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 50
          },
          "datasource": {
            "type": "prometheus",
            "uid": "Prometheus"
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum by(controller, le) (rate(workqueue_queue_duration_seconds_bucket[5m])))",
              "legendFormat": "{{controller}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          }
        },
        {
          "id": 16,
          "title": "p99 Workqueue Work Duration by Controller",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 50
          },
          "datasource": {
