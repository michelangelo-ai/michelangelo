---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-config
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
    - name: 'default'
      orgId: 1
      folder: ''
      type: file
      disableDeletion: false
      updateIntervalSeconds: 10
      allowUiUpdates: true
      options:
        path: /var/lib/grafana/dashboards

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        # Pinned to an explicit version (not `:latest`) so the sandbox doesn't
        # silently stick to whatever digest a node happened to cache first.
        # Bump manually when a CVE affecting this version is reported.
        image: grafana/grafana:13.1.1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        env:
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: "admin"
        - name: GF_INSTALL_PLUGINS
          value: "grafana-clock-panel,grafana-simple-json-datasource"
        volumeMounts:
        - name: grafana-storage
          mountPath: /var/lib/grafana
        - name: grafana-datasources
          mountPath: /etc/grafana/provisioning/datasources
        - name: grafana-dashboards-config
          mountPath: /etc/grafana/provisioning/dashboards
        - name: grafana-dashboard-crd-metrics
          mountPath: /var/lib/grafana/dashboards/crd-metrics
        - name: grafana-dashboard-controllermgr
          mountPath: /var/lib/grafana/dashboards/controllermgr
        - name: grafana-dashboard-model-serving
          mountPath: /var/lib/grafana/dashboards/model-serving
        - name: grafana-dashboard-ray-jobs
          mountPath: /var/lib/grafana/dashboards/ray-jobs
      volumes:
      - name: grafana-storage
        emptyDir: {}
      - name: grafana-datasources
        configMap:
          name: grafana-datasources
      - name: grafana-dashboards-config
        configMap:
          name: grafana-dashboards-config
      - name: grafana-dashboard-crd-metrics
        configMap:
          name: grafana-dashboard-crd-metrics
      - name: grafana-dashboard-controllermgr
        configMap:
          name: grafana-dashboard-controllermgr
      - name: grafana-dashboard-model-serving
        configMap:
          name: grafana-dashboard-model-serving
      - name: grafana-dashboard-ray-jobs
        configMap:
          name: grafana-dashboard-ray-jobs

---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  selector:
    app: grafana
  ports:
  - name: grafana
    port: 3000
    targetPort: 3000
    nodePort: 30012
  type: NodePort
