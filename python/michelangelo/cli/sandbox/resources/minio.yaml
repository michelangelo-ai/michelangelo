apiVersion: v1
kind: Pod
metadata:
  labels:
    app: minio
  name: minio
spec:
  containers:
    - name: minio
      # Mirrored to ghcr.io (rather than quay.io/minio/minio directly) so the
      # sandbox doesn't depend on an external registry's pull rate limits/
      # availability -- see https://github.com/michelangelo-ai/michelangelo/pkgs/container/minio
      image: ghcr.io/michelangelo-ai/minio:RELEASE.2025-05-24T17-08-30Z
      imagePullPolicy: IfNotPresent
      command:
        - /bin/bash
        - -c
      args:
        - minio server /data --console-address :9090 --address :9091
      volumeMounts:
        - mountPath: /data
          name: data-volume
  volumes:
    - name: data-volume
      hostPath:
        path: /shared/minio-data
        type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  labels:
    app: minio
spec:
  type: NodePort
  ports:
    - port: 9090
      nodePort: 30008
      name: "9090"
    - port: 9091
      nodePort: 30007
      name: "9091"
  selector:
    app: minio
