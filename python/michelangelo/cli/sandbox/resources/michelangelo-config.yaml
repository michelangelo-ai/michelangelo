---
apiVersion: v1
kind: ConfigMap
metadata:
  name: michelangelo-config
data:
  MA_FILE_SYSTEM: s3://default
  MA_FILE_SYSTEM_S3_SCHEME: http
  AWS_ACCESS_KEY_ID: minioadmin
  AWS_SECRET_ACCESS_KEY: minioadmin
  AWS_ENDPOINT_URL: http://minio:9091
  # REGISTRY_ENDPOINT is intentionally absent here -- it is patched in from
  # helm/michelangelo/values-k3d.yaml's workloadConfig.registryEndpoint.value
  # by sandbox.py's _sync_registry_endpoint_from_values(), so values-k3d.yaml
  # stays the single source of truth instead of duplicating the literal here.

