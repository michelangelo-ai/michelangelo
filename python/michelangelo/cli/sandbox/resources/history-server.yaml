# Ray History Server for the k3d sandbox.
#
# Source: upstream kuberay historyserver/config/historyserver.yaml @ v1.7.1,
# adapted for the sandbox:
#   - MinIO instead of real S3 (S3_ENDPOINT minio:9091, path-style, SSL off),
#     credentials from the object-storage-credentials Secret
#   - NodePort 30016 instead of the upstream ClusterIP
#   - resources and --session-cache-max-memory scaled down for a single-node
#     k3d node (~31Gi); upstream asks for 500m/2Gi with a 12Gi limit and an
#     8Gi session cache
#
# As of v1.7 the server is configured entirely through env
# (STORAGE_BACKEND / STORAGE_ROOT_DIR) instead of the v1.6 command-line flags,
# and reads the standard AWS_* credential names instead of the fork's custom
# aliases.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: historyserver
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: raycluster-reader
rules:
- apiGroups: ["ray.io"]
  resources: ["rayclusters"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: historyserver
subjects:
- kind: ServiceAccount
  name: historyserver
  namespace: default
roleRef:
  kind: ClusterRole
  name: raycluster-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: history-server
  labels:
    app: history-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: history-server
  template:
    metadata:
      labels:
        app: history-server
    spec:
      serviceAccountName: historyserver
      containers:
      - name: history-server
        image: quay.io/kuberay/historyserver:v1.7.1
        imagePullPolicy: IfNotPresent
        # No command override: the image entrypoints the historyserver binary.
        # The cache cap is a soft limit, so limits.memory must sit above it.
        args:
        - --session-cache-max-memory=1Gi
        env:
        - name: STORAGE_BACKEND
          value: "s3"
        # Root dir inside the bucket. Must match the collector sidecar's
        # STORAGE_ROOT_DIR (logPersistence pathPrefix), otherwise the server
        # reads an empty prefix and lists no sessions.
        - name: STORAGE_ROOT_DIR
          value: "log"
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: "object-storage-credentials"
              key: "AWS_ACCESS_KEY_ID"
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: "object-storage-credentials"
              key: "AWS_SECRET_ACCESS_KEY"
        - name: AWS_SESSION_TOKEN
          value: ""
        - name: S3_BUCKET
          value: "ray-history"
        - name: S3_ENDPOINT
          value: "minio:9091"
        - name: S3_REGION
          value: "us-east-1"
        - name: S3FORCE_PATH_STYLE
          value: "true"
        - name: S3DISABLE_SSL
          value: "true"
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "2Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: history-server
spec:
  selector:
    app: history-server
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    nodePort: 30016
  type: NodePort
