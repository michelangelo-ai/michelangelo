# pydoc-markdown configuration for Michelangelo AI SDK reference docs.
# Outputs Markdown into docs/api-reference/, which Docusaurus picks up automatically
# via the autogenerated sidebar in website/sidebars.ts.
#
# Run:   python -m pydoc_markdown
# Or:    bun run docs:api  (see website/package.json)

loaders:
  - type: python
    search_path:
      - python

    # Public SDK modules only. Excludes: _private, _internal, gen (generated
    # protobuf/k8s code), tests, cli internals, and canvas schema internals.
    # Pointing at concrete submodules rather than __init__.py re-exporters so
    # pydoc-markdown captures actual docstrings.
    modules:
      # Uniflow — task/workflow decorators and execution framework
      - michelangelo.uniflow.core.decorator
      - michelangelo.uniflow.core.task_config
      - michelangelo.uniflow.core.context
      - michelangelo.uniflow.core.image_spec
      - michelangelo.uniflow.core.io_registry

      # Uniflow plugins
      - michelangelo.uniflow.plugins.ray.task
      - michelangelo.uniflow.plugins.ray.run_config
      - michelangelo.uniflow.plugins.ray.io
      - michelangelo.uniflow.plugins.spark.task
      - michelangelo.uniflow.plugins.spark.io
      - michelangelo.uniflow.plugins.pandas.io

      # CanvasFlex — pusher (available now); assembler coming soon
      - michelangelo.workflow.tasks.pusher.task
      - michelangelo.workflow.tasks.pusher.registry
      - michelangelo.workflow.tasks.pusher.exceptions

      # Trainer — PyTorch training utilities
      - michelangelo.lib.trainer.torch.data_collate_functions
      - michelangelo.lib.trainer.torch.utils

      # Native Transformer — TorchScript/ONNX-exportable transform layers
      - michelangelo.lib.native_transform.torch.base_layers
      - michelangelo.lib.native_transform.torch.id_hash_tokenizer
      - michelangelo.lib.native_transform.torch.utils

      # Workflow variables — DatasetVariable and friends
      - michelangelo.workflow.variables.types
      - michelangelo.workflow.variables.metadata

processors:
  - type: filter
    skip_empty_modules: true
    exclude_private: true
    documented_only: true

  - type: smart

  - type: crossref

renderer:
  type: docusaurus
  docs_base_path: docs
  relative_output_path: api-reference
  sidebar_top_level_label: "API Reference"
