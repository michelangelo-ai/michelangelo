{{- /*
In k8s-rbac auth mode the apiserver validates bearer tokens with
TokenReview and authorizes requests with SubjectAccessReview. Both are
cluster-scoped APIs, so the platform ServiceAccount needs the built-in
system:auth-delegator ClusterRole regardless of whether the chart runs in
cluster-wide or watchNamespace mode.
*/ -}}
{{- if and .Values.serviceAccount.create (eq .Values.apiserver.auth.mode "k8s-rbac") }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "michelangelo.fullname" . }}-auth-delegator
  labels:
    {{- include "michelangelo.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: {{ include "michelangelo.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
