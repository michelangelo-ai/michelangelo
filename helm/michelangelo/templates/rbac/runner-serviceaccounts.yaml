{{- /*
Per-project machine identity for the worker's pipeline activities. Each
listed project namespace gets a michelangelo-runner ServiceAccount and a
RoleBinding granting it michelangelo-editor rights in that namespace only,
so a caller who can trigger a run in project A gets at most the runner's
rights in A -- never a platform-wide identity's rights elsewhere. The
worker mints short-lived tokens for these ServiceAccounts when
worker.runnerToken.enabled is on.
*/ -}}
{{- if eq .Values.apiserver.auth.mode "k8s-rbac" }}
{{- range $ns := .Values.apiserver.auth.runnerProjects }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: michelangelo-runner
  namespace: {{ $ns }}
  labels:
    {{- include "michelangelo.labels" $ | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: michelangelo-runner-editor
  namespace: {{ $ns }}
  labels:
    {{- include "michelangelo.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: michelangelo-editor
subjects:
  - kind: ServiceAccount
    name: michelangelo-runner
    namespace: {{ $ns }}
{{- end }}
{{- end }}
