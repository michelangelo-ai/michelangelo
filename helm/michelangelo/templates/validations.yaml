{{- $auth := include "michelangelo.authValues" . | fromJson -}}
{{- $runnerToken := include "michelangelo.runnerTokenValues" . | fromJson -}}
{{/*
Fail fast on invalid value combinations before any resource is created.
This file renders to empty YAML when all checks pass.
*/}}
{{- if and .Values.cadence.enabled .Values.temporal.enabled -}}
{{- fail "cadence.enabled and temporal.enabled cannot both be true — pick one workflow engine per release. Set workflow.engine=cadence + cadence.enabled=true, OR workflow.engine=temporal + temporal.enabled=true. See helm/michelangelo/README.md." -}}
{{- end -}}
{{- if and .Values.monitoring.enabled (not .Values.controllermgr.enabled) -}}
{{- fail "monitoring.enabled requires controllermgr.enabled=true — the controller manager is the only component exposing a /metrics endpoint. See helm/michelangelo/README.md." -}}
{{- end -}}
{{- $authMode := default "" $auth.mode -}}
{{- if not (has $authMode (list "" "dummy" "k8s-rbac")) -}}
{{- fail (printf "apiserver.auth.mode must be \"dummy\" or \"k8s-rbac\" (got %q) — a typo here renders no auth config at all and silently falls back to the permissive dummy default. See docs/operator-guides/setup/authentication.md." $authMode) -}}
{{- end -}}
{{- if eq $authMode "k8s-rbac" -}}
{{- if and (not $auth.oidc.issuerUrl) (not $auth.serviceAccounts.enabled) -}}
{{- fail "apiserver.auth.mode=k8s-rbac requires apiserver.auth.oidc.issuerUrl and/or apiserver.auth.serviceAccounts.enabled=true — otherwise no caller could ever authenticate. See docs/operator-guides/setup/authentication.md." -}}
{{- end -}}
{{- if and $auth.oidc.issuerUrl (not $auth.oidc.audiences) -}}
{{- fail "apiserver.auth.oidc.issuerUrl is set but apiserver.auth.oidc.audiences is empty — at least one accepted audience is required. See docs/operator-guides/setup/authentication.md." -}}
{{- end -}}
{{- end -}}
{{- if and $runnerToken.enabled (ne $authMode "k8s-rbac") -}}
{{- fail "worker.runnerToken.enabled=true has no effect unless apiserver.auth.mode=k8s-rbac — in dummy mode the apiserver accepts every request regardless, so the worker would mint tokens nobody validates. See docs/operator-guides/setup/authentication.md." -}}
{{- end -}}
{{- $gcs := default dict .Values.gcsStorage -}}
{{- if and $gcs.enabled (hasKey $gcs "anonymous") (not (kindIs "invalid" $gcs.anonymous)) (not (kindIs "bool" $gcs.anonymous)) -}}
{{- fail (printf "gcsStorage.anonymous must be a boolean (true or false), got %s %q — with --set-string the value is a non-empty string, which Helm treats as true. Use --set gcsStorage.anonymous=true|false. See helm/michelangelo/README.md." (kindOf $gcs.anonymous) (toString $gcs.anonymous)) -}}
{{- end -}}
{{- if and $gcs.enabled $gcs.anonymous $gcs.existingSecret -}}
{{- fail "gcsStorage.anonymous and gcsStorage.existingSecret cannot both be set — anonymous access sends no credentials, so the Secret would be unused. Unset one of them. See helm/michelangelo/README.md." -}}
{{- end -}}
{{- if and $gcs.enabled $gcs.endpoint (not $gcs.anonymous) (not (hasPrefix "https://" $gcs.endpoint)) -}}
{{- fail "gcsStorage.endpoint must start with https:// unless gcsStorage.anonymous=true — plain-http endpoints are for emulators only and must not receive credentials. See helm/michelangelo/README.md." -}}
{{- end -}}
{{- if .Values.envoy.corsAllowCredentials -}}
{{- if not (kindIs "bool" .Values.envoy.corsAllowCredentials) -}}
{{- fail (printf "envoy.corsAllowCredentials must be a boolean (true or false), got %s %q — with --set-string the value is a non-empty string, which Helm treats as true. Use --set envoy.corsAllowCredentials=true|false. See docs/operator-guides/setup/ui-authentication.md." (kindOf .Values.envoy.corsAllowCredentials) (toString .Values.envoy.corsAllowCredentials)) -}}
{{- end -}}
{{- $envoyCorsOrigins := .Values.envoy.corsOrigins -}}
{{- if and $envoyCorsOrigins (not (kindIs "string" $envoyCorsOrigins)) -}}
{{- fail (printf "envoy.corsOrigins must be a string (a single RE2 regex such as \"https://ml\\\\.example\\\\.com\"), got %s %q. See docs/operator-guides/setup/ui-authentication.md." (kindOf $envoyCorsOrigins) (toString $envoyCorsOrigins)) -}}
{{- else -}}
{{- $permissive := not $envoyCorsOrigins -}}
{{- if $envoyCorsOrigins -}}
{{- /* Compile the regex as written first, so an invalid one fails here with Helm's "error parsing regexp" message naming $envoyCorsOrigins. */ -}}
{{- $_ := mustRegexMatch $envoyCorsOrigins "" -}}
{{- /* Envoy's safe_regex is a full match, so anchor the same way, then probe with origins no deployment should allow. A regex that accepts them accepts any host. */ -}}
{{- $anchored := printf "^(?:%s)$" $envoyCorsOrigins -}}
{{- range list "null" "https://michelangelo-cors-probe.invalid" "http://michelangelo-cors-probe.invalid" -}}
{{- if mustRegexMatch $anchored . -}}{{- $permissive = true -}}{{- end -}}
{{- end -}}
{{- end -}}
{{- if $permissive -}}
{{- fail (printf "envoy.corsAllowCredentials=true requires an explicit, non-wildcard envoy.corsOrigins regex, got %q. Leaving corsOrigins unset renders \".*\", and patterns such as \".*\", \"^.*$\", \".+\" or \"https?://.*\" match every origin (including \"null\"). Envoy's CORS filter reflects the caller's exact Origin on a match — combined with allow_credentials this would let any origin make authenticated, credentialed calls. List the UI origin explicitly with dots escaped, e.g. \"https://ml\\\\.example\\\\.com\". See docs/operator-guides/setup/ui-authentication.md." (toString (default "" $envoyCorsOrigins))) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- $apiCredentials := .Values.ui.apiCredentials -}}
{{- if and (not (kindIs "invalid" $apiCredentials)) (ne (toString $apiCredentials) "") -}}
{{- if not (and (kindIs "string" $apiCredentials) (has $apiCredentials (list "include" "same-origin" "omit"))) -}}
{{- fail (printf "ui.apiCredentials must be \"include\", \"same-origin\", or \"omit\" (or empty for the default), got %s %q — these are fetch()'s only valid credentials modes, and non-string values such as false or 0 are rejected rather than treated as unset. See docs/operator-guides/setup/ui-authentication.md." (kindOf $apiCredentials) (toString $apiCredentials)) -}}
{{- end -}}
{{- if and (eq (toString $apiCredentials) "include") (not .Values.envoy.corsAllowCredentials) -}}
{{- fail "ui.apiCredentials=include requires envoy.corsAllowCredentials=true (with a matching, non-wildcard envoy.corsOrigins) — otherwise the browser sends the session cookie but Envoy's CORS response won't allow the page to read the result. See docs/operator-guides/setup/ui-authentication.md." -}}
{{- end -}}
{{- end -}}
