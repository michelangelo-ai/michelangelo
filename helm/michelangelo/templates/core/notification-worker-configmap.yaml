{{- if .Values.notificationWorker.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "michelangelo.componentFullname" (dict "context" . "component" "notification-worker-config") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "michelangelo.componentLabels" (dict "context" . "component" "notification-worker") | nindent 4 }}
data:
  base.yaml: |
    logging:
      level: {{ .Values.notificationWorker.logging.level | default "info" }}
      development: {{ .Values.notificationWorker.logging.development | default false }}
      encoding: {{ .Values.notificationWorker.logging.encoding | default "json" }}

    workflow-engine:
      host: {{ required "workflow.endpoint is required — see helm/michelangelo/README.md#values-reference" .Values.workflow.endpoint | quote }}
      transport: grpc
      {{- if eq .Values.workflow.engine "cadence" }}
      provider: cadence
      {{- else if eq .Values.workflow.engine "temporal" }}
      provider: temporal
      {{- else }}
      {{- fail (printf "workflow.engine must be 'cadence' or 'temporal', got: %s" .Values.workflow.engine) }}
      {{- end }}
      workers:
        - domain: {{ .Values.workflow.domain | default "default" | quote }}
          taskList: {{ .Values.notificationWorker.taskList | quote }}
      client:
        domain: {{ .Values.workflow.domain | default "default" | quote }}

    notification:
      taskList: {{ .Values.notificationWorker.taskList | quote }}
      {{- with .Values.notificationWorker.studioBaseURL }}
      studioBaseURL: {{ . | quote }}
      {{- end }}
      {{- with .Values.notificationWorker.senderEmail }}
      senderEmail: {{ . | quote }}
      {{- end }}

    minio:
      awsRegion: {{ .Values.objectStorage.region | default "us-east-1" | quote }}
      awsAccessKeyId: ${AWS_ACCESS_KEY_ID}
      awsSecretAccessKey: ${AWS_SECRET_ACCESS_KEY}
      awsEndpointUrl: {{ required "objectStorage.endpoint is required — see helm/michelangelo/README.md#values-reference" .Values.objectStorage.endpoint | quote }}
      secure: {{ .Values.objectStorage.secure }}
{{- end }}
