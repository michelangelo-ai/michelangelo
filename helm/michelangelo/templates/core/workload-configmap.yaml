{{/*
  Workload ConfigMap — platform-level environment variables for pipeline pods.

  This ConfigMap is referenced by Ray/Spark task pods via envFrom.configMapRef
  to inject backing-service endpoints (REGISTRY_ENDPOINT, AWS_ENDPOINT_URL,
  etc.) without requiring pipeline authors to hardcode them.

  The sandbox CLI (sandbox.py) enables this template (workloadConfig.enabled
  in values-k3d.yaml) and is now the sole owner of the michelangelo-config
  ConfigMap for the control plane -- it no longer kubectl-applies a separate
  static manifest. sandbox.py's _sync_config_from_secret() still patches the
  credential fields post-Helm, since those may diverge from values-k3d.yaml's
  static defaults on a pre-configured VM (e.g. CI) and Helm can't read a live
  Secret's value at template-render time.
*/}}
{{- if .Values.workloadConfig.enabled }}
{{- if not (hasKey .Values.workloadConfig.env "REGISTRY_ENDPOINT") }}
{{- fail "workloadConfig.enabled=true requires workloadConfig.env.REGISTRY_ENDPOINT to be set. Otherwise no REGISTRY_ENDPOINT key would be written and pipelines would silently fall back to InMemoryRegistryClient." -}}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.workloadConfig.configMapName | default "michelangelo-config" }}
  labels:
    {{- include "michelangelo.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.workloadConfig.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
