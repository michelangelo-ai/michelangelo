# Values under litellm are passed directly to the pinned upstream chart.
litellm:
  replicaCount: 2

  image:
    repository: ghcr.io/berriai/litellm-non_root
    tag: "v1.85.1@sha256:97ce25938fc7f38f14a4036df78ba3d57725706b6183488af9931750e395c673"
    pullPolicy: IfNotPresent

  imagePullSecrets: []
  nameOverride: litellm
  fullnameOverride: litellm

  serviceAccount:
    create: true
    automount: false
    annotations: {}
    name: litellm

  deploymentMinReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  podAnnotations: {}
  podLabels: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - ALL

  service:
    type: ClusterIP
    port: 4000
    annotations: {}
  ingress:
    enabled: false
    className: ""
    labels: {}
    annotations: {}
    hosts: []
    tls: []

  masterkeySecretName: litellm-secrets
  masterkeySecretKey: masterkey

  proxyConfigMap:
    create: true
    name: ""
    key: config.yaml
  proxy_config:
    model_list: []
    general_settings:
      master_key: os.environ/PROXY_MASTER_KEY
      disable_prisma_schema_update: true
    litellm_settings:
      cache: false
      success_callback:
        - prometheus

  environmentSecrets: []
  environmentConfigMaps: []
  # Literal values must be strings (for example, "true" or "42"); use
  # valueFrom.secretKeyRef for credentials instead of embedding them here.
  extraEnvVars:
    - name: LITELLM_SALT_KEY
      valueFrom:
        secretKeyRef:
          name: litellm-secrets
          key: saltkey
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: litellm-secrets
          key: database-url
    - name: DISABLE_SCHEMA_UPDATE
      value: "true"

  db:
    useExisting: false
    deployStandalone: false
  redis:
    enabled: false

  logLevel: INFO
  envVars: {}
  command: []
  args:
    - --config
    - /etc/litellm/config.yaml

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi

  startupProbe:
    path: /health/readiness
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 30
  livenessProbe:
    path: /health/liveliness
    initialDelaySeconds: 0
    periodSeconds: 15
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 5
  readinessProbe:
    path: /health/readiness
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 3

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  keda:
    enabled: false
  pdb:
    enabled: true
    minAvailable: null
    maxUnavailable: 1
    annotations: {}
    labels: {}
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: litellm
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: litellm

  nodeSelector: {}
  tolerations: []
  affinity: {}
  terminationGracePeriodSeconds: 90

  # These resources are owned by this wrapper because the upstream behavior
  # does not meet the Michelangelo runtime contract.
  migrationJob:
    enabled: false
  serviceMonitor:
    enabled: false

# Runs database migrations before gateway installation/upgrade. Exactly one of enabled
# and managedExternally must be true.
migrationJob:
  enabled: true
  # Use with enabled=false when another deployment step runs the qualified migrations.
  managedExternally: false
  # Must already exist: pre-install/PreSync hooks run before chart resources.
  serviceAccountName: default
  # Deadline in seconds for the whole Job; must be at least 1.
  activeDeadlineSeconds: 900
  # Retry limit before the Job is marked failed; 0 disables retries.
  backoffLimit: 4
  # Seconds after finishing before a Job is eligible for TTL cleanup; 0 is immediate.
  # Successful hooks are deleted on success. A later hook run can remove failed
  # Jobs before this TTL expires, so this is not a guaranteed log-retention period.
  ttlSecondsAfterFinished: 86400
  # Extra Job annotations; chart-owned hook annotations cannot be overridden.
  annotations: {}
  # Migration container requests/limits, independent of the serving Pods' resources.
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      cpu: 500m
      memory: 2Gi
  hooks:
    # Select exactly one hook engine when migrationJob.enabled is true.
    helm:
      # Run before Helm installs or upgrades the gateway release.
      enabled: true
      # Lower weights run before higher weights in the same hook phase.
      weight: 0
    argocd:
      # Use an Argo CD PreSync hook instead of the Helm hooks.
      enabled: false

# Restricts gateway traffic when the cluster's network plugin enforces policies.
networkPolicy:
  enabled: false
  migration:
    # With managed migration hooks, enable only after installing a separate
    # migration policy; the regular gateway policy is created after the hook.
    managedExternally: false
  # Allow TCP/UDP DNS to these selectors; adapt them to the cluster's DNS Pods.
  allowDNS: true
  dns:
    namespaceSelector:
      kubernetes.io/metadata.name: kube-system
    podSelector:
      k8s-app: kube-dns
  # Caller/monitoring rules; wrapper-test ingress is added when tests.enabled.
  # An empty list grants no other ingress through this policy.
  ingress: []
  # Permit the database, providers, and identity endpoints used by this release.
  # Empty rules grant no egress beyond the DNS rule controlled by allowDNS.
  egress: []

# Requires the Prometheus Operator ServiceMonitor CRD and authenticated metrics.
serviceMonitor:
  # Rendering fails if enabled without authorization.secretName or secretKey.
  enabled: false
  # Match the labels selected by the cluster's Prometheus installation.
  labels: {}
  # Extra annotations on the ServiceMonitor, not the gateway Pods.
  annotations: {}
  # How often to scrape, as a Prometheus duration such as 15s or 1m.
  interval: 15s
  # Per-scrape timeout; do not exceed interval.
  scrapeTimeout: 10s
  path: /metrics
  # Empty selects Services in this release's namespace.
  namespaceSelector: {}
  authorization:
    # Required when enabled: existing same-namespace Secret containing a
    # LiteLLM credential authorized to scrape metrics, not a plaintext token.
    secretName: ""
    # Key in that Secret containing the metrics bearer token.
    secretKey: token

# Authenticated /v1/models smoke test; not a scoped-key inference/policy test.
# Run only this wrapper hook with helm test --filter
# name=<release>-michelangelo-llm-gateway-test-connection.
tests:
  enabled: true
  image:
    # Keep the qualified digest when mirroring this image to a private registry.
    repository: curlimages/curl
    # The schema enforces this exact tag/digest; upgrades require a newly qualified pin.
    tag: "8.12.1@sha256:94e9e444bcba979c2ea12e27ae39bee4cd10bc7041a472c4727a558e213744e6"
    pullPolicy: IfNotPresent
  # Maximum duration of the HTTP request, in seconds.
  timeoutSeconds: 10
