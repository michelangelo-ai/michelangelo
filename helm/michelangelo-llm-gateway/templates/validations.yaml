{{- if ne .Values.litellm.nameOverride "litellm" -}}
{{- fail "litellm.nameOverride must remain litellm so wrapper selectors stay stable" -}}
{{- end -}}
{{- if ne .Values.litellm.fullnameOverride "litellm" -}}
{{- fail "litellm.fullnameOverride must remain litellm so wrapper resources target the dependency" -}}
{{- end -}}
{{- if or .Values.litellm.db.deployStandalone .Values.litellm.db.useExisting -}}
{{- fail "the wrapper requires litellm.db.deployStandalone=false and litellm.db.useExisting=false; provide DATABASE_URL through litellm.extraEnvVars" -}}
{{- end -}}
{{- if .Values.litellm.redis.enabled -}}
{{- fail "the wrapper does not install Redis; provide an approved external Redis configuration if it is required" -}}
{{- end -}}
{{- if .Values.litellm.migrationJob.enabled -}}
{{- fail "litellm.migrationJob.enabled must remain false because the wrapper owns the qualified migration Job" -}}
{{- end -}}
{{- if .Values.litellm.serviceMonitor.enabled -}}
{{- fail "litellm.serviceMonitor.enabled must remain false because the wrapper owns the authenticated ServiceMonitor" -}}
{{- end -}}
{{- if ne .Values.litellm.image.tag "v1.85.1@sha256:97ce25938fc7f38f14a4036df78ba3d57725706b6183488af9931750e395c673" -}}
{{- fail "litellm.image.tag must pin the qualified v1.85.1 non-root image digest" -}}
{{- end -}}
{{- if empty .Values.litellm.masterkeySecretName -}}
{{- fail "litellm.masterkeySecretName is required" -}}
{{- end -}}
{{- if empty .Values.litellm.masterkeySecretKey -}}
{{- fail "litellm.masterkeySecretKey is required" -}}
{{- end -}}
{{- range $label := list "app.kubernetes.io/name" "app.kubernetes.io/instance" -}}
{{- if hasKey $.Values.litellm.podLabels $label -}}
{{- fail (printf "litellm.podLabels cannot override selector label %s" $label) -}}
{{- end -}}
{{- end -}}
{{- if hasKey .Values.litellm.podAnnotations "checksum/config" -}}
{{- fail "litellm.podAnnotations cannot override chart-owned checksum/config" -}}
{{- end -}}

{{- $seenEnv := dict -}}
{{- range $env := .Values.litellm.extraEnvVars -}}
{{- if hasKey $seenEnv $env.name -}}
{{- fail (printf "litellm.extraEnvVars contains duplicate %s" $env.name) -}}
{{- end -}}
{{- $_ := set $seenEnv $env.name true -}}
{{- if has $env.name (list "PROXY_MASTER_KEY" "HOST" "PORT" "LITELLM_LOG") -}}
{{- fail (printf "litellm.extraEnvVars cannot override chart-owned %s" $env.name) -}}
{{- end -}}
{{- if has $env.name (list "DATABASE_URL" "LITELLM_SALT_KEY") -}}
{{- if hasKey $env "value" -}}
{{- fail (printf "litellm.extraEnvVars.%s must use valueFrom.secretKeyRef" $env.name) -}}
{{- end -}}
{{- $valueFrom := required (printf "litellm.extraEnvVars.%s.valueFrom is required" $env.name) $env.valueFrom -}}
{{- $secretKeyRef := required (printf "litellm.extraEnvVars.%s.valueFrom.secretKeyRef is required" $env.name) $valueFrom.secretKeyRef -}}
{{- if or (empty $secretKeyRef.name) (empty $secretKeyRef.key) -}}
{{- fail (printf "litellm.extraEnvVars.%s secret name and key are required" $env.name) -}}
{{- end -}}
{{- else if eq $env.name "DISABLE_SCHEMA_UPDATE" -}}
{{- if or (not (hasKey $env "value")) (ne (toString $env.value) "true") -}}
{{- fail "litellm.extraEnvVars.DISABLE_SCHEMA_UPDATE must be the string true" -}}
{{- end -}}
{{- else if and (hasKey $env "value") (regexMatch "(?i)(KEY|TOKEN|PASSWORD|SECRET)$" $env.name) -}}
{{- fail (printf "sensitive environment variable %s must use valueFrom" $env.name) -}}
{{- end -}}
{{- end -}}
{{- range $requiredName := list "DATABASE_URL" "LITELLM_SALT_KEY" "DISABLE_SCHEMA_UPDATE" -}}
{{- if not (hasKey $seenEnv $requiredName) -}}
{{- fail (printf "litellm.extraEnvVars must define %s" $requiredName) -}}
{{- end -}}
{{- end -}}
{{- range $name, $_ := .Values.litellm.envVars -}}
{{- if or (has $name (list "PROXY_MASTER_KEY" "DATABASE_URL" "LITELLM_SALT_KEY" "DISABLE_SCHEMA_UPDATE" "HOST" "PORT" "LITELLM_LOG")) (regexMatch "(?i)(KEY|TOKEN|PASSWORD|SECRET)$" $name) -}}
{{- fail (printf "litellm.envVars cannot contain reserved or sensitive variable %s" $name) -}}
{{- end -}}
{{- end -}}

{{- include "michelangelo-llm-gateway.validateProxyConfigSecrets" (dict "value" .Values.litellm.proxy_config "path" "litellm.proxy_config") -}}
{{- if .Values.litellm.proxyConfigMap.create -}}
{{- if ne .Values.litellm.proxyConfigMap.key "config.yaml" -}}
{{- fail "litellm.proxyConfigMap.key must be config.yaml when create=true" -}}
{{- end -}}
{{- $generalSettings := default dict .Values.litellm.proxy_config.general_settings -}}
{{- if ne (get $generalSettings "master_key") "os.environ/PROXY_MASTER_KEY" -}}
{{- fail "litellm.proxy_config.general_settings.master_key must use os.environ/PROXY_MASTER_KEY" -}}
{{- end -}}

{{- if ne (get $generalSettings "disable_prisma_schema_update") true -}}
{{- fail "litellm.proxy_config.general_settings.disable_prisma_schema_update must be true" -}}
{{- end -}}
{{- $litellmSettings := default dict .Values.litellm.proxy_config.litellm_settings -}}
{{- if or (not (hasKey $litellmSettings "cache")) (ne (get $litellmSettings "cache") false) -}}
{{- fail "litellm.proxy_config.litellm_settings.cache must be false" -}}
{{- end -}}
{{- if .Values.serviceMonitor.enabled -}}
{{- $callbacks := default list (get $litellmSettings "success_callback") -}}
{{- if not (has "prometheus" $callbacks) -}}
{{- fail "litellm.proxy_config.litellm_settings.success_callback must include prometheus when serviceMonitor is enabled" -}}
{{- end -}}
{{- end -}}
{{- else -}}
{{- if empty .Values.litellm.proxyConfigMap.name -}}
{{- fail "litellm.proxyConfigMap.name is required when create=false" -}}
{{- end -}}
{{- if empty .Values.litellm.proxyConfigMap.key -}}
{{- fail "litellm.proxyConfigMap.key is required when create=false" -}}
{{- end -}}
{{- end -}}

{{- if hasKey .Values.litellm "priorityClassName" -}}
{{- fail "litellm.priorityClassName is unsupported by the pinned upstream Deployment" -}}
{{- end -}}
{{- range $direction := list "ingress" "egress" -}}
{{- range $ruleIndex, $rule := get $.Values.networkPolicy $direction -}}
{{- range $portIndex, $port := default list $rule.ports -}}
{{- if and (hasKey $port "endPort") (lt (int $port.endPort) (int $port.port)) -}}
{{- fail (printf "networkPolicy.%s[%d].ports[%d].endPort cannot be less than port" $direction $ruleIndex $portIndex) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}

{{- if eq .Values.migrationJob.enabled .Values.migrationJob.managedExternally -}}
{{- fail "exactly one of migrationJob.enabled and migrationJob.managedExternally must be true" -}}
{{- end -}}
{{- if .Values.migrationJob.enabled -}}
{{- if eq .Values.migrationJob.hooks.helm.enabled .Values.migrationJob.hooks.argocd.enabled -}}
{{- fail "managed migrations require exactly one of the Helm or Argo CD hooks" -}}
{{- end -}}
{{- if empty .Values.migrationJob.serviceAccountName -}}
{{- fail "migrationJob.serviceAccountName is required" -}}
{{- end -}}
{{- range $annotation := list "helm.sh/hook" "helm.sh/hook-delete-policy" "helm.sh/hook-weight" "argocd.argoproj.io/hook" "argocd.argoproj.io/hook-delete-policy" -}}
{{- if hasKey $.Values.migrationJob.annotations $annotation -}}
{{- fail (printf "migrationJob.annotations cannot override chart-owned %s" $annotation) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if and .Values.networkPolicy.enabled .Values.migrationJob.enabled (not .Values.networkPolicy.migration.managedExternally) -}}
{{- fail "networkPolicy-enabled migration hooks require a pre-existing externally managed migration NetworkPolicy" -}}
{{- end -}}

{{- if .Values.serviceMonitor.enabled -}}
{{- if empty .Values.serviceMonitor.authorization.secretName -}}
{{- fail "serviceMonitor.authorization.secretName is required when serviceMonitor is enabled" -}}
{{- end -}}
{{- if empty .Values.serviceMonitor.authorization.secretKey -}}
{{- fail "serviceMonitor.authorization.secretKey is required when serviceMonitor is enabled" -}}
{{- end -}}
{{- end -}}
{{- if and .Values.litellm.autoscaling.enabled .Values.litellm.keda.enabled -}}
{{- fail "litellm.autoscaling.enabled and litellm.keda.enabled cannot both be true" -}}
{{- end -}}
{{- if gt (int .Values.litellm.autoscaling.minReplicas) (int .Values.litellm.autoscaling.maxReplicas) -}}
{{- fail "litellm.autoscaling.minReplicas cannot exceed maxReplicas" -}}
{{- end -}}
{{- if eq .Values.litellm.strategy.type "RollingUpdate" -}}
{{- $rollingUpdate := .Values.litellm.strategy.rollingUpdate -}}
{{- if and (hasKey $rollingUpdate "maxSurge") (hasKey $rollingUpdate "maxUnavailable") -}}
{{- if and (has (toString $rollingUpdate.maxSurge) (list "0" "0%")) (has (toString $rollingUpdate.maxUnavailable) (list "0" "0%")) -}}
{{- fail "litellm.strategy.rollingUpdate maxSurge and maxUnavailable cannot both be zero" -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if and (ne .Values.litellm.pdb.minAvailable nil) (ne .Values.litellm.pdb.maxUnavailable nil) -}}
{{- fail "set only one of litellm.pdb.minAvailable and maxUnavailable" -}}
{{- end -}}
{{- if and .Values.tests.enabled (ne .Values.tests.image.tag "8.12.1@sha256:94e9e444bcba979c2ea12e27ae39bee4cd10bc7041a472c4727a558e213744e6") -}}
{{- fail "tests.image.tag must pin the qualified curl test image digest" -}}
{{- end -}}
