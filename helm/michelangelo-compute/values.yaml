# -----------------------------------------------------------------------------
# Michelangelo compute chart values
#
# Install one release per cluster, named michelangelo-compute, in namespace
# michelangelo-compute. The operators run in the release namespace; the control
# plane creates RayClusters and SparkApplications in namespace default.
#
# values.schema.json rejects unknown top-level keys, and
# templates/validations.yaml fails rendering when a setting the control plane
# relies on changes.
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# Control-plane identity — the ServiceAccount the control plane authenticates
# as, with a Role in namespace default and read access to Kueue ClusterQueues.
# -----------------------------------------------------------------------------
rayManager:
  # Render the identity objects. Deleting the ServiceAccount (false, or an
  # uninstall) invalidates the token the control plane registered.
  create: true
  # Names the ServiceAccount, Role and RoleBinding. The token Secret is
  # <name>-token; the ClusterRole and ClusterRoleBinding are
  # <name>-clusterqueues.
  name: ray-manager
  # Render <name>-token (type kubernetes.io/service-account-token), which
  # registration reads. The token does not expire: to rotate it, delete the
  # Secret and run helm upgrade.
  tokenSecret: true
  grants:
    # Manage SparkApplications in default (federated Spark dispatch).
    spark: false
    # Read LocalQueues in default and ClusterQueues.
    kueueRead: true

# -----------------------------------------------------------------------------
# KubeRay operator — upstream chart kuberay-operator 1.7.1.
# Values under kuberay-operator are passed to the pinned upstream chart.
# -----------------------------------------------------------------------------
kuberay-operator:
  # Install the KubeRay operator.
  enabled: true
  metrics:
    serviceMonitor:
      # Requires the Prometheus Operator CRDs (monitoring.coreos.com/v1).
      enabled: false

# -----------------------------------------------------------------------------
# Spark Operator — upstream chart spark-operator 2.5.2 (Kubeflow).
# Values under spark-operator are passed to the pinned upstream chart. The two
# spark settings below are enforced while the subchart is enabled.
# -----------------------------------------------------------------------------
spark-operator:
  # Install the Spark Operator. When false, its enforced settings no longer apply.
  enabled: true
  spark:
    # Must contain default: the control plane creates every SparkApplication
    # there, and the operator ignores SparkApplications in unlisted namespaces.
    # The driver ServiceAccount and Role are rendered only in listed namespaces.
    jobNamespaces:
      - default
    serviceAccount:
      # Must be spark-operator-spark: the control plane sets this driver
      # ServiceAccount on every SparkApplication, and upstream would otherwise
      # derive it from the release name.
      name: spark-operator-spark
  webhook:
    # The webhook fails closed, so keep two replicas and a disruption budget.
    replicas: 2
    podDisruptionBudget:
      enable: true
      minAvailable: 1
  prometheus:
    podMonitor:
      # Requires the Prometheus Operator CRDs (monitoring.coreos.com/v1).
      create: false
