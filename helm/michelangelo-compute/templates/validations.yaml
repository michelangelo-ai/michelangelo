{{/*
Fail fast on values that break what the control plane relies on. Every message
starts with the values path it rejects. Checks for a subchart apply only while
that subchart is enabled. This file renders to empty YAML when all checks pass.
*/}}

{{- /* Spark Operator: the control plane creates every SparkApplication in default, with this driver ServiceAccount. */ -}}
{{- $sparkOperator := index .Values "spark-operator" -}}
{{- if $sparkOperator.enabled -}}
{{- if ne (toString $sparkOperator.spark.serviceAccount.name) "spark-operator-spark" -}}
{{- fail "spark-operator.spark.serviceAccount.name must be spark-operator-spark because the control plane sets this driver ServiceAccount on every SparkApplication" -}}
{{- end -}}
{{- if not (has "default" $sparkOperator.spark.jobNamespaces) -}}
{{- fail "spark-operator.spark.jobNamespaces must contain default because the control plane creates every SparkApplication there" -}}
{{- end -}}
{{- end -}}

{{- /* Runtime contract: every pod the control plane creates in default reads michelangelo-config and the credentials Secret. */ -}}
{{- $config := .Values.runtime.config -}}
{{- range $key := list "MA_FILE_SYSTEM" "AWS_ENDPOINT_URL" "REGISTRY_ENDPOINT" -}}
{{- if or (not (hasKey $config $key)) (eq (toString (index $config $key)) "") -}}
{{- fail (printf "runtime.config.%s must be set because it names something reachable from this cluster, so no default can be right" $key) -}}
{{- end -}}
{{- end -}}
{{- range $key := list "AWS_ACCESS_KEY_ID" "AWS_SECRET_ACCESS_KEY" -}}
{{- if hasKey $config $key -}}
{{- fail (printf "runtime.config.%s must not be set because the credentials belong in the Secret named by runtime.objectStorageCredentials.name" $key) -}}
{{- end -}}
{{- end -}}
{{- $credentials := .Values.runtime.objectStorageCredentials -}}
{{- if eq (toString $credentials.name) "" -}}
{{- fail "runtime.objectStorageCredentials.name must be set to controllermgr's logPersistence.credentialsSecret because every pod the control plane creates reads that Secret" -}}
{{- end -}}
{{- range $key := list "accessKeyId" "secretAccessKey" -}}
{{- $value := toString (index $credentials $key) -}}
{{- if and $credentials.create (eq $value "") -}}
{{- fail (printf "runtime.objectStorageCredentials.%s must be set when runtime.objectStorageCredentials.create is true because the chart renders the Secret from it" $key) -}}
{{- end -}}
{{- if and (not $credentials.create) (ne $value "") -}}
{{- fail (printf "runtime.objectStorageCredentials.%s must be empty when runtime.objectStorageCredentials.create is false because keys enter Helm values only when the chart creates the Secret" $key) -}}
{{- end -}}
{{- end -}}
