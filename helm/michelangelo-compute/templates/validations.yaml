{{/*
Fail fast on values that break what the control plane relies on. Every message
starts with the values path it rejects. Checks for a subchart apply only while
that subchart is enabled. This file renders to empty YAML when all checks pass.
*/}}

{{- /* Spark Operator: the control plane creates every SparkApplication in default, with this driver ServiceAccount. */ -}}
{{- $sparkOperator := index .Values "spark-operator" -}}
{{- if $sparkOperator.enabled -}}
{{- if ne (toString $sparkOperator.spark.serviceAccount.name) "spark-operator-spark" -}}
{{- fail "spark-operator.spark.serviceAccount.name must be spark-operator-spark because the control plane sets this driver ServiceAccount on every SparkApplication" -}}
{{- end -}}
{{- if not (has "default" $sparkOperator.spark.jobNamespaces) -}}
{{- fail "spark-operator.spark.jobNamespaces must contain default because the control plane creates every SparkApplication there" -}}
{{- end -}}
{{- end -}}

{{- /* Kueue: the four Configuration deltas keep its webhooks out of every create path the control plane does not use and align its timers with the control plane's. Values compare as JSON, so a number never matches a string. */ -}}
{{- $kueue := .Values.kueue -}}
{{- if $kueue.enabled -}}
{{- $kueueConfig := fromYaml $kueue.managerConfig.controllerManagerConfigYaml -}}
{{- if ne (toJson (dig "managedJobsNamespaceSelector" (dict) $kueueConfig)) (toJson (dict "matchLabels" (dict "kubernetes.io/metadata.name" "default"))) -}}
{{- fail "kueue.managerConfig.controllerManagerConfigYaml must set managedJobsNamespaceSelector to matchLabels kubernetes.io/metadata.name: default because it confines Kueue's job webhooks to the namespace the control plane dispatches to" -}}
{{- end -}}
{{- $frameworks := toJson (dig "integrations" "frameworks" (list) $kueueConfig) -}}
{{- $sparkFrameworks := toJson (list "ray.io/raycluster" "sparkoperator.k8s.io/sparkapplication") -}}
{{- if and (ne $frameworks (toJson (list "ray.io/raycluster"))) (ne $frameworks $sparkFrameworks) -}}
{{- fail "kueue.managerConfig.controllerManagerConfigYaml must set integrations.frameworks to [ray.io/raycluster], optionally followed by sparkoperator.k8s.io/sparkapplication, because Kueue must gate only the kinds the control plane labels" -}}
{{- end -}}
{{- if ne (toJson (dig "waitForPodsReady" "timeout" "" $kueueConfig)) (toJson "1h") -}}
{{- fail "kueue.managerConfig.controllerManagerConfigYaml must set waitForPodsReady.timeout to 1h because it must exceed the control plane's provisioning budget" -}}
{{- end -}}
{{- if ne (toJson (dig "waitForPodsReady" "recoveryTimeout" "" $kueueConfig)) (toJson "0s") -}}
{{- fail "kueue.managerConfig.controllerManagerConfigYaml must set waitForPodsReady.recoveryTimeout to 0s because evicting a running RayCluster that lost a pod kills its job" -}}
{{- end -}}
{{- if ne (toJson (dig "waitForPodsReady" "requeuingStrategy" "backoffLimitCount" "" $kueueConfig)) (toJson 2) -}}
{{- fail "kueue.managerConfig.controllerManagerConfigYaml must set waitForPodsReady.requeuingStrategy.backoffLimitCount to 2 because Kueue otherwise requeues a workload that never starts forever" -}}
{{- end -}}
{{- if ne (toJson (dig "resources" "excludeResourcePrefixes" (list) $kueueConfig)) (toJson (list "ephemeral-storage")) -}}
{{- fail "kueue.managerConfig.controllerManagerConfigYaml must set resources.excludeResourcePrefixes to [ephemeral-storage] because ClusterQueues do not ration the node-local disk Ray pods request" -}}
{{- end -}}
{{- if eq $frameworks $sparkFrameworks -}}
{{- /* The subchart joins the gates into one --feature-gates flag, where the last entry for a gate wins. */ -}}
{{- $sparkGate := false -}}
{{- range $kueue.controllerManager.featureGates -}}
{{- if eq (toString .name) "SparkApplicationIntegration" -}}
{{- $sparkGate = eq (toJson .enabled) "true" -}}
{{- end -}}
{{- end -}}
{{- if not $sparkGate -}}
{{- fail "kueue.controllerManager.featureGates must enable SparkApplicationIntegration while kueue.managerConfig.controllerManagerConfigYaml lists sparkoperator.k8s.io/sparkapplication because Kueue does not start otherwise" -}}
{{- end -}}
{{- end -}}
{{- end -}}

{{- /* Runtime contract: every pod the control plane creates in default reads michelangelo-config and the credentials Secret. */ -}}
{{- $config := .Values.runtime.config -}}
{{- range $key := list "MA_FILE_SYSTEM" "AWS_ENDPOINT_URL" "REGISTRY_ENDPOINT" -}}
{{- if or (not (hasKey $config $key)) (eq (toString (index $config $key)) "") -}}
{{- fail (printf "runtime.config.%s must be set because it names something reachable from this cluster, so no default can be right" $key) -}}
{{- end -}}
{{- end -}}
{{- range $key := list "AWS_ACCESS_KEY_ID" "AWS_SECRET_ACCESS_KEY" -}}
{{- if hasKey $config $key -}}
{{- fail (printf "runtime.config.%s must not be set because the credentials belong in the Secret named by runtime.objectStorageCredentials.name" $key) -}}
{{- end -}}
{{- end -}}
{{- $credentials := .Values.runtime.objectStorageCredentials -}}
{{- if eq (toString $credentials.name) "" -}}
{{- fail "runtime.objectStorageCredentials.name must be set to controllermgr's logPersistence.credentialsSecret because every pod the control plane creates reads that Secret" -}}
{{- end -}}
{{- range $key := list "accessKeyId" "secretAccessKey" -}}
{{- $value := toString (index $credentials $key) -}}
{{- if and $credentials.create (eq $value "") -}}
{{- fail (printf "runtime.objectStorageCredentials.%s must be set when runtime.objectStorageCredentials.create is true because the chart renders the Secret from it" $key) -}}
{{- end -}}
{{- if and (not $credentials.create) (ne $value "") -}}
{{- fail (printf "runtime.objectStorageCredentials.%s must be empty when runtime.objectStorageCredentials.create is false because keys enter Helm values only when the chart creates the Secret" $key) -}}
{{- end -}}
{{- end -}}
