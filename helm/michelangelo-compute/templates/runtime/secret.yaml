{{- /*
The object-storage credentials every pod the control plane creates in namespace
default reads. Running pods read it, so neither an uninstall nor a switch to
create: false deletes it.
*/ -}}
{{- $credentials := .Values.runtime.objectStorageCredentials }}
{{- if $credentials.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $credentials.name }}
  namespace: default
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "michelangelo-compute.labels" . | nindent 4 }}
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: {{ $credentials.accessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ $credentials.secretAccessKey | quote }}
{{- end }}
