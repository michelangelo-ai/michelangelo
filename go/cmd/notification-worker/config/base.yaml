worker:
  address: localhost:15566
  maApiServiceName: ma-apiserver

logging:
  level: info
  development: true
  encoding: console

workflow-engine:
  # Cadence host — switch to temporal host (default: 127.0.0.1:7233) for Temporal
  host: ${WORKFLOW_ENGINE_HOST:127.0.0.1:7833}
  transport: grpc
  # Set to "temporal" to use Temporal instead of Cadence
  provider: ${WORKFLOW_ENGINE_PROVIDER:cadence}
  workers:
    - domain: ${WORKFLOW_ENGINE_DOMAIN:default}
      # taskList must match the value of notification.taskList below and
      # PipelineRunNotifier.Config.TaskList in the controller manager.
      taskList: ${NOTIFICATION_TASK_LIST:notification_worker}
  client:
    domain: ${WORKFLOW_ENGINE_DOMAIN:default}

# Notification-specific configuration.
# All fields support ${ENV_VAR:default} syntax for environment-variable override,
# which is the recommended approach for Kubernetes deployments (12-factor).
notification:
  # taskList must match the taskList registered above.
  # Required — the notifier will fail at startup if empty.
  # Override: NOTIFICATION_TASK_LIST=my-task-list
  taskList: ${NOTIFICATION_TASK_LIST:notification_worker}

  # studioBaseURL is the base URL of the platform UI, used to build deep links
  # in notification message bodies. Must end with a trailing slash.
  # Example: "https://ml.mycompany.com/studio/"
  # Optional — if empty, no deep link is included in notifications.
  # Override: NOTIFICATION_STUDIO_BASE_URL=https://ml.mycompany.com/studio/
  studioBaseURL: ${NOTIFICATION_STUDIO_BASE_URL:}

  # senderEmail is the From address for outgoing email notifications.
  # Required when a real email transport activity is wired; the built-in
  # no-op activity ignores this field.
  # Override: NOTIFICATION_SENDER_EMAIL=ml-notifications@mycompany.com
  senderEmail: ${NOTIFICATION_SENDER_EMAIL:}
