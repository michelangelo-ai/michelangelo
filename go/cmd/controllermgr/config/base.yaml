controllermgr:
  metricsBindAddress: ${METRICS_ADDRESS::8091}
  healthProbeBindAddress: ${HEALTH_ADDRESS::8083}
  leaderElection: false
  leaderElectionID: decaf1259.michelangelo.uber.com

workflowClient:
  service: cadence-frontend
  host: localhost:7833
  transport: grpc
  domain: default
  # taskList is a used as a fallback if project.Metatdata.Annotations["michelangelo/worker_queue"] is empty
  taskList: default # TODO(#934): MaCTL support for adding project.Metatdata.Annotations["michelangelo/worker_queue"] to project CRD
  executionUrlFormat: http://localhost:8088/namespaces/{{.Domain}}/workflows/{{.ExecutionID}}

k8s:
  qps: 300
  burst: 600
metadataStorage:
  enableMetadataStorage: false

ingester:
  concurrentReconciles: 1
  requeuePeriod: 30s

pipeline:
  revisioningEnabled: false

pipelineRun:
  # ttlDays: 0  # 0 disables TTL eviction; set e.g. 30 to evict runs older than 30 days

# Notification configuration for PipelineRun state-change workflows.
# To use a custom worker task list, change taskList here and in helm values.yaml,
# and register the notification workflow/activities on that task list in your
# cmd/worker/main.go. Set taskList to "" to disable notifications entirely.
notification:
  taskList: notification_worker
  studioBaseURL: ${NOTIFICATION_STUDIO_BASE_URL:""}
  senderEmail: ${NOTIFICATION_SENDER_EMAIL:""}

controllers:
  rayCluster:
    k8sQps: 300
    k8sBurst: 600

# k8sengine mapper config — consumed by go/components/jobs/client/k8sengine.
# logPersistence drives both the collector-sidecar injection (mapRayCluster)
# and the human-browsable log_url computation (MapLocalClusterStatusToGlobal).
jobs:
  k8sengine:
    mapper:
      logPersistence:
        enabled: true
        storageEndpoint: "k3d-michelangelo-sandbox-agent-0:30007"
        bucket: ray-history
        pathPrefix: log
        region: us-east-1
        credentialsSecret: minio-credentials
        collectorImage: quay.io/kuberay/collector:v1.7.1
        s3DisableSSL: true
        # exposableEventTypes sets RAY_DASHBOARD_AGGREGATOR_AGENT_EXPOSABLE_EVENT_TYPES
        # on every Ray container. "ALL" requires Ray >= 2.54; for older Ray images
        # replace it with the explicit list:
        # TASK_DEFINITION_EVENT,TASK_LIFECYCLE_EVENT,ACTOR_TASK_DEFINITION_EVENT,TASK_PROFILE_EVENT,DRIVER_JOB_DEFINITION_EVENT,DRIVER_JOB_LIFECYCLE_EVENT,ACTOR_DEFINITION_EVENT,ACTOR_LIFECYCLE_EVENT,NODE_DEFINITION_EVENT,NODE_LIFECYCLE_EVENT
        exposableEventTypes: "ALL"
        # logURLFormat is a Go text/template that builds the human-browsable
        # log URL. Available vars: {{.Bucket}}, {{.PathPrefix}}, {{.ClusterName}},
        # {{.RayLocalNamespace}}. Sandbox default points at the in-cluster MinIO
        # console; production overlays point at OCI Object Storage / S3 console.
        # Path mirrors the KubeRay v1.7 object layout:
        # {pathPrefix}/cluster-history/raycluster/{namespace}/{cluster}/...
        logURLFormat: "http://localhost:9090/browser/{{.Bucket}}/{{.PathPrefix}}/cluster-history/raycluster/{{.RayLocalNamespace}}/{{.ClusterName}}/"

minio:
  awsRegion: us-east-1
  awsAccessKeyId: michelangeloadmin
  awsSecretAccessKey: michelangeloadmin
  awsEndpointUrl: localhost:9091

inferenceServer:
  gateway:
    # Name is the k8s Gateway resource that HTTPRoutes attach to via parentRefs.
    name: ma-gateway
    # Istio's Gateway controller materializes a Service named '<gateway>-istio'
    # for each Gateway resource. The IS controller's EndpointSource reads the
    # NodePort + node InternalIP of this Service to publish per-cluster
    # EndpointSlices in the control plane.
    serviceName: ma-gateway-istio
    serviceNamespace: default
    portName: http
  triton:
    # defaultImage overrides the serving image for Triton-backed
    # InferenceServers that don't set spec.initSpec.servingSpec.image. Empty
    # uses the controller's built-in default, which is the supported setting;
    # set this only to pin a different image.
    defaultImage: ""
    # readinessProbe selects how Triton replicas report readiness to their
    # Service. "model-aware" (default) keeps a replica out of the Service until
    # every serving model in the inference server's model config is loaded, so
    # traffic never reaches a replica that is still loading after a restart.
    # "server" uses Triton's /v2/health/ready only; "none" adds no probe.
    # model-aware needs python3 in the serving image (the py3 Triton images).
    readinessProbe: model-aware
    # probes overrides the timing of the Triton pod probes. Zero or omitted fields
    # keep the built-in values (startup 5s period / 3s timeout / 60 failures, liveness
    # 10s / 5s / 6, readiness 10s / 8s for model-aware or 5s for server / 3). Changing
    # a value changes the pod template, so running Triton pods restart once.
    probes:
      startup: {}
      liveness: {}
      readiness: {}

# Deployment controller (OSS plugin) rollout safety settings.
deployment:
  rollout:
    # skipCanary disables the per-cluster canary phase, in which the new model is
    # loaded and validated on one replica before the rest of the cluster loads it.
    skipCanary: false
    # modelLoadTimeout bounds how long a cluster may take to load the new model on
    # every replica (canary and full load each get this budget). Exceeding it fails
    # the rollout, which rolls the candidate back.
    modelLoadTimeout: 15m
    # soakPeriod is how long to keep serving from a cluster, with the health and
    # metric gates active, before moving on to the next cluster. A Zonal strategy's
    # rolloutPeriodInSeconds overrides it; Blast skips soaking. 0s disables it.
    soakPeriod: 0s
  rollback:
    # modelLoadTimeout bounds how long a rollback waits for the previous model to be
    # loaded again on every replica before restoring traffic to it.
    modelLoadTimeout: 15m
  metricGate:
    # prometheusURL enables the metric gate: while a rollout or soak is in progress
    # the queries below are evaluated every reconcile and any breach rolls the
    # candidate back. Empty disables the gate. In the sandbox, the Prometheus
    # bundled with the Temporal chart answers at
    # http://michelangelo-prometheus-server.default.svc:80.
    prometheusURL: ""
    timeout: 10s
    # failClosed treats an unreachable Prometheus as a gate failure. The default
    # keeps rolling out and logs the outage instead.
    failClosed: false
    # queries are Go templates over {{.Model}}, {{.Deployment}}, {{.Namespace}} and
    # {{.InferenceServer}}. A query breaches when any returned sample compares true
    # against threshold ("gt" by default, or "lt"). With no queries configured the
    # gate uses Triton's per-model failure ratio over 5m with a 5% threshold.
    queries: []