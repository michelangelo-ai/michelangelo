name: Transcoder services check

on:
  pull_request:
    paths:
      - 'proto/**'
      - 'helm/michelangelo/files/**'
  push:
    branches:
      - main
    paths:
      - 'proto/**'
      - 'helm/michelangelo/files/**'

permissions:
  contents: read

jobs:
  check:
    name: Verify transcoder-services.json is in sync with proto/api
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check transcoder-services.json matches proto/api
        run: tools/check-transcoder-services.sh
