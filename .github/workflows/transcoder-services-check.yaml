name: Transcoder services check

# Narrower than it looks: this only needs to catch a
# javascript/packages/rpc/services.ts change that isn't followed by a
# regeneration of helm/michelangelo/files/transcoder-services.json.
# Proto-side staleness (a .proto change without a corresponding
# descriptors.pb/transcoder-services.json regen) is now caught
# unconditionally by the "Check transcoder descriptor artifacts are up to
# date" step in main.yml's dirty-check job, which fires on every proto/go
# change via `tools/gen-descriptors.sh` — the same underlying generator this
# job also calls. That job doesn't run on javascript/**-only changes
# (main.yml ignores that path entirely), which is the gap this job covers.
on:
  pull_request:
    paths:
      - 'javascript/packages/rpc/services.ts'
      - 'helm/michelangelo/files/**'
      - 'tools/gen-descriptors.sh'
      - 'tools/check-transcoder-services.sh'
  push:
    branches:
      - main
    paths:
      - 'javascript/packages/rpc/services.ts'
      - 'helm/michelangelo/files/**'
      - 'tools/gen-descriptors.sh'
      - 'tools/check-transcoder-services.sh'

permissions:
  contents: read

jobs:
  check:
    name: Verify transcoder-services.json matches services.ts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Cache Bazel outputs — tools/gen-descriptors.sh builds
      # //proto/api/v2:v2_proto to produce the descriptor set it resolves
      # services.ts's references against. Shares main.yml's cache key.
      - name: Restore Bazel Cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/bazel
          key: bazel-main-${{ runner.os }}-${{ hashFiles('.bazelversion', 'MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: |
            bazel-main-${{ runner.os }}-

      - name: Set up buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check transcoder-services.json is up to date
        run: tools/check-transcoder-services.sh
