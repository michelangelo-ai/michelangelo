name: Changelog

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to generate changelog for (e.g. v0.3.0). Defaults to latest tag.'
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          fi

          if [ -z "$TAG" ]; then
            echo "::error::No tag found. Push a tag or provide one via workflow_dispatch."
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using tag: $TAG"

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        id: cliff-latest
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Generate full changelog
        uses: orhun/git-cliff-action@v4
        id: cliff-full
        with:
          config: cliff.toml
          args: --output CHANGELOG.md
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          body_path: RELEASE_NOTES.md
          append_body: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit CHANGELOG.md
        id: changelog-diff
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md unchanged, skipping PR"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Determine base branch for tag
        id: base-branch
        if: steps.changelog-diff.outputs.changed == 'true'
        run: |
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          BASE=$(git branch -r --contains "${{ steps.tag.outputs.tag }}" \
            | sed 's#^[* ]*origin/##' \
            | grep -E '^release/v[0-9]' | sort -V | tail -1)
          if [ -z "$BASE" ]; then
            BASE="main"
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "Using base branch: $BASE"

      - name: Open PR to update CHANGELOG.md
        if: steps.changelog-diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ${{ steps.base-branch.outputs.base }}
          commit-message: "docs: update CHANGELOG.md for ${{ steps.tag.outputs.tag }}"
          title: "docs: update CHANGELOG.md for ${{ steps.tag.outputs.tag }}"
          body: "Auto-generated by changelog.yml via git-cliff. Both `main` and release branches require PRs (org ruleset), so this can't be pushed directly."
          branch: "changelog/${{ steps.tag.outputs.tag }}"
          add-paths: CHANGELOG.md

      - name: Upload changelog artifact
        uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: |
            CHANGELOG.md
            RELEASE_NOTES.md
          retention-days: 90
