name: Integration tests

on:
  workflow_run:
    workflows: ["Build examples Docker image"]
    types: [completed]
  workflow_dispatch:
    inputs:
      image_tag:
        description: >
          GHCR examples image tag to use as the task image.
          Use your branch name or a sha- tag to test a branch build.
          Defaults to "latest" (built from main).
        required: false
        default: "latest"
  workflow_call:
    inputs:
      image_tag:
        description: "GHCR examples image tag"
        required: false
        type: string
        default: "latest"
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC every day

jobs:
  sandbox-e2e:
    # For workflow_run: only proceed if the triggering build succeeded.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, linux, gcp]
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./python

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # k3d, kubectl, helm, and AWS CLI v2 are pre-installed on the GCP self-hosted runner.
      # The examples task image is pre-loaded into k3s containerd on the runner VM.
      # Install Poetry + project dependencies using the system Python 3.11.
      - name: Install Poetry and dependencies
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          poetry env use python3
          poetry install --no-interaction -E dev -E example

      # Sync restarts only Michelangelo app services (apiserver, envoy, ui, worker,
      # controllermgr). Infrastructure (MySQL, Cadence, MinIO, Grafana, Prometheus)
      # is kept running between runs — no re-init overhead.
      - name: Sync sandbox
        run: $HOME/.local/bin/poetry run ma sandbox sync --workflow cadence

      - name: Check out integration-test repo
        uses: actions/checkout@v4
        with:
          repository: michelangelo-ai/integration-test
          ref: add-mysql-list-tests
          token: ${{ secrets.CR_PAT }}
          path: integration-test

      - name: Install integration test dependencies
        run: .venv/bin/pip install retrying pyyaml pymysql -q

      # Diagnostic: confirm what's actually running in the cluster before
      # the MySQL tests, since their failure mode (V2 ext.operation
      # silently ignored) is indistinguishable from "wrong binary loaded",
      # "config not loaded", or "metadataStorage flag not set".
      - name: Diagnose apiserver runtime
        run: |
          set -x
          # Image actually loaded by k3d
          kubectl get pod michelangelo-apiserver -o jsonpath='{.spec.containers[0].image}' && echo
          kubectl get pod michelangelo-apiserver -o jsonpath='{.status.containerStatuses[0].imageID}' && echo
          # Env vars on the running container
          kubectl exec michelangelo-apiserver -- env | grep -E '^(CONFIG_DIR|RUNTIME_ENVIRONMENT)=' || true
          # Config files the apiserver can actually see
          kubectl exec michelangelo-apiserver -- ls -la /config || true
          kubectl exec michelangelo-apiserver -- cat /config/base.yaml || true
          # First lines of the apiserver log — the "Configuration" line
          # printed at startup tells us the loaded config struct.
          kubectl logs michelangelo-apiserver --tail=120 || true
          # Controllermgr: env from pod spec (works on distroless) + logs
          kubectl get pod michelangelo-controllermgr -o jsonpath='{.spec.containers[0].image}' && echo
          kubectl get pod michelangelo-controllermgr -o jsonpath='{.spec.containers[0].env}' && echo
          kubectl get pod michelangelo-controllermgr -o jsonpath='restarts={.status.containerStatuses[0].restartCount}' && echo
          kubectl logs michelangelo-controllermgr --tail=60 || true
          kubectl logs michelangelo-controllermgr --previous --tail=60 || true
          # Is the controllermgr writing data to MySQL?
          kubectl exec mysql -- mysql -uroot -proot michelangelo -e "SHOW TABLES; SELECT COUNT(*) AS pipeline_rows FROM pipeline;" || true

      - name: Run API CRUD tests
        run: |
          $GITHUB_WORKSPACE/python/.venv/bin/pytest \
            functional/api/test_api_crud.py \
            -v -m "api and crud"
        working-directory: ${{ github.workspace }}/integration-test
        env:
          MA_API_SERVER: localhost:15566
          GIT_REF: main
          PYTHONPATH: ${{ github.workspace }}/integration-test

      - name: Run API MySQL backend tests
        run: |
          $GITHUB_WORKSPACE/python/.venv/bin/pytest \
            functional/api/test_api_mysql.py \
            -v -m "api and ci"
        working-directory: ${{ github.workspace }}/integration-test
        env:
          MA_API_SERVER: localhost:15566
          GIT_REF: main
          PYTHONPATH: ${{ github.workspace }}/integration-test

      - name: Run CLI e2e tests
        run: |
          $GITHUB_WORKSPACE/python/.venv/bin/pytest \
            functional/cli/test_cli.py \
            -v -m "cli"
        working-directory: ${{ github.workspace }}/integration-test
        env:
          MA_API_SERVER: localhost:15566
          MA_NAMESPACE: ma-dev-test
          MICHELANGELO_PYTHON_DIR: ${{ github.workspace }}/python
          PYTHONPATH: ${{ github.workspace }}/integration-test

      # Infrastructure is intentionally kept running between CI runs.
