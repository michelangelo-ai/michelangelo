name: Integration tests

on:
  workflow_run:
    workflows: ["Nightly Build"]
    types: [completed]
  workflow_dispatch:
    inputs:
      image_tag:
        description: >
          GHCR examples image tag to use as the task image.
          Use your branch name or a sha- tag to test a branch build.
          Defaults to "latest" (built from main).
        required: false
        default: "latest"
      integration_test_ref:
        description: >
          Branch or ref of michelangelo-ai/integration-test to check out.
          Defaults to "main". Use a feature branch to test unreleased fixture changes.
        required: false
        default: "main"
      worker_tag:
        description: >
          GHCR worker image tag. Use a dev-release sha tag to test worker changes.
          Defaults to "main".
        required: false
        default: "main"
      apiserver_tag:
        description: >
          GHCR apiserver image tag. Use a dev-release sha tag to test apiserver changes.
          Defaults to "main".
        required: false
        default: "main"
      controllermgr_tag:
        description: >
          GHCR controllermgr image tag. Use a dev-release sha tag to test controllermgr changes.
          Defaults to "main".
        required: false
        default: "main"
      recreate_sandbox:
        description: Recreate the disposable k3d sandbox before running integration tests.
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      image_tag:
        description: "GHCR examples image tag"
        required: false
        type: string
        default: "latest"
      integration_test_ref:
        description: "Branch or ref of michelangelo-ai/integration-test to check out"
        required: false
        type: string
        default: "main"
      worker_tag:
        description: "GHCR worker image tag"
        required: false
        type: string
        default: "main"
      apiserver_tag:
        description: "GHCR apiserver image tag"
        required: false
        type: string
        default: "main"
      controllermgr_tag:
        description: "GHCR controllermgr image tag"
        required: false
        type: string
        default: "main"
      recreate_sandbox:
        description: "Recreate the disposable k3d sandbox before running integration tests"
        required: false
        type: boolean
        default: false

jobs:
  sandbox-e2e:
    # For workflow_run: only proceed if the triggering build succeeded.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, linux, gcp]
    timeout-minutes: 120
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./python

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # k3d, kubectl, helm, and AWS CLI v2 are pre-installed on the GCP self-hosted runner.
      # The examples task image is pre-loaded into k3s containerd on the runner VM.
      # Install Poetry + project dependencies using the system Python 3.11.
      - name: Install Poetry and dependencies
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          poetry env use python3
          poetry install --no-interaction -E dev -E example

      - name: Recover storage-pressured sandbox
        run: ../.github/scripts/recover-sandbox-storage.sh
        env:
          FORCE_RECREATE_SANDBOX: ${{ inputs.recreate_sandbox || false }}

      - name: Recover failed MySQL pod
        run: |
          if [ "$(kubectl get pod mysql -o jsonpath='{.status.phase}' 2>/dev/null || true)" = "Failed" ]; then
            kubectl delete pod mysql --ignore-not-found
            kubectl apply -f michelangelo/cli/sandbox/resources/mysql.yaml
            kubectl wait --for=condition=Ready pod/mysql --timeout=180s
          fi

      - name: Ensure Cadence domain exists
        run: |
          if ! k3d cluster get michelangelo-sandbox >/dev/null 2>&1; then
            echo "Sandbox does not exist yet; sandbox create will register the domain."
            exit 0
          fi

          api_ready=false
          for attempt in $(seq 1 12); do
            k3d cluster start michelangelo-sandbox || true
            if kubectl get --raw=/readyz >/dev/null 2>&1; then
              api_ready=true
              break
            fi
            echo "Kubernetes API is not ready (attempt ${attempt}/12)."
            if (( attempt < 12 )); then
              sleep 5
            fi
          done
          if [[ "${api_ready}" = false ]]; then
            k3d cluster list || true
            docker ps --filter name=k3d-michelangelo-sandbox || true
            kubectl cluster-info || true
            exit 1
          fi

          frontend_ready=false
          for attempt in $(seq 1 6); do
            if kubectl wait --for=condition=available deployment \
                --selector app.kubernetes.io/name=cadence,app.kubernetes.io/component=frontend \
                --timeout=30s; then
              frontend_ready=true
              break
            fi
            echo "Cadence frontend is not ready (attempt ${attempt}/6)."
            if (( attempt < 6 )); then
              sleep 5
            fi
          done
          if [[ "${frontend_ready}" = false ]]; then
            k3d cluster list || true
            docker ps --filter name=k3d-michelangelo-sandbox || true
            kubectl cluster-info || true
            kubectl get deployments,pods --namespace default -o wide || true
            kubectl describe deployment \
              --selector app.kubernetes.io/name=cadence,app.kubernetes.io/component=frontend \
              --namespace default || true
            kubectl logs deployment/michelangelo-cadence-frontend \
              --namespace default --all-containers --tail=200 || true
            exit 1
          fi

          for attempt in $(seq 1 21); do
            pod_name="cadence-domain-${GITHUB_RUN_ID}-${attempt}"
            if registration_output=$(kubectl run "${pod_name}" \
                --restart=Never --rm --stdin \
                --image=ubercadence/cli:v1.2.6 \
                --env=CADENCE_CLI_ADDRESS=michelangelo-cadence-frontend:7933 \
                --command -- cadence --domain default domain register --rd 1 2>&1); then
              echo "${registration_output}"
              exit 0
            fi
            echo "${registration_output}"
            if grep -Eq 'Domain already exists|already registered' \
                <<< "${registration_output}"; then
              echo "Cadence domain 'default' is already registered."
              exit 0
            fi
            if (( attempt < 21 )); then
              sleep 5
            fi
          done
          exit 1

      # Sync restarts only Michelangelo app services (apiserver, envoy, ui, worker,
      # controllermgr). Infrastructure (MySQL, Cadence, MinIO, Grafana, Prometheus)
      # is kept running between runs — no re-init overhead.
      - name: Sync sandbox
        run: |
          $HOME/.local/bin/poetry run ma sandbox sync --workflow cadence \
            --set apiserver.metadataStorage.enable=true \
            --set controllermgr.metadataStorage.enable=true \
            --set controllermgr.jobs.k8sengine.mapper.logPersistence.enabled=false \
            --set monitoring.enabled=false \
            --set images.apiserver.tag=${{ inputs.apiserver_tag || 'main' }} \
            --set images.worker.tag=${{ inputs.worker_tag || 'main' }} \
            --set images.controllermgr.tag=${{ inputs.controllermgr_tag || 'main' }} \
            --set inferenceServer.gateway.name=ma-gateway \
            --set inferenceServer.gateway.serviceName=ma-gateway-istio \
            --set inferenceServer.gateway.serviceNamespace=default \
            --set inferenceServer.gateway.portName=http \
            --set objectStorage.existingSecret=minio-credentials

      - name: Diagnose sandbox sync failure
        if: failure()
        run: |
          kubectl get deployments,pods --namespace default -o wide || true
          kubectl describe deployment/michelangelo-worker \
            --namespace default || true
          kubectl describe pods --namespace default \
            --selector app.kubernetes.io/component=worker || true
          kubectl get pods --namespace default \
            --selector app.kubernetes.io/component=worker \
            -o custom-columns='NAME:.metadata.name,PHASE:.status.phase,IMAGE:.spec.containers[*].image,IMAGE_ID:.status.containerStatuses[*].imageID,RESTARTS:.status.containerStatuses[*].restartCount' \
            || true
          while read -r pod; do
            echo "Current logs for ${pod}"
            kubectl logs "${pod}" --namespace default \
              --all-containers --tail=200 || true
            echo "Previous logs for ${pod}"
            kubectl logs "${pod}" --namespace default \
              --all-containers --previous --tail=200 || true
          done < <(kubectl get pods --namespace default \
            --selector app.kubernetes.io/component=worker -o name)

      - name: Check out integration-test repo
        uses: actions/checkout@v7
        with:
          repository: michelangelo-ai/integration-test
          ref: ${{ inputs.integration_test_ref || 'main' }}
          token: ${{ secrets.CR_PAT }}
          path: integration-test

      - name: Check out michelangelo-examples repo
        uses: actions/checkout@v7
        with:
          repository: michelangelo-ai/michelangelo-examples
          ref: main
          path: michelangelo-examples

      - name: Install integration test dependencies
        run: .venv/bin/pip install retrying pyyaml pymysql -q

      - name: Install michelangelo-examples dependencies
        # only michelangelo_examples' own thin package needs installing here.
        run: .venv/bin/pip install -q --no-deps "$GITHUB_WORKSPACE/michelangelo-examples"

      - name: Wait for apiserver gRPC readiness
        run: |
          if kubectl rollout status deployment/michelangelo-apiserver \
              --namespace default --timeout=300s \
            && .venv/bin/python - <<'PY'
          import grpc

          channel = grpc.insecure_channel("localhost:15566")
          try:
              grpc.channel_ready_future(channel).result(timeout=300)
              print("Michelangelo apiserver gRPC endpoint is ready.")
          finally:
              channel.close()
          PY
          then
            exit 0
          fi

          kubectl get pods --namespace default -o wide || true
          kubectl describe deployment/michelangelo-apiserver \
            --namespace default || true
          kubectl logs deployment/michelangelo-apiserver --namespace default \
            --all-containers --tail=200 || true
          exit 1

      - name: Run API CRUD tests
        run: |
          $GITHUB_WORKSPACE/python/.venv/bin/pytest \
            functional/api/test_api_crud.py \
            -v -m "api and crud"
        working-directory: ${{ github.workspace }}/integration-test
        env:
          MA_API_SERVER: localhost:15566
          PYTHONPATH: ${{ github.workspace }}/integration-test

      - name: Run API MySQL backend tests
        run: |
          $GITHUB_WORKSPACE/python/.venv/bin/pytest \
            functional/api/test_api_mysql.py \
            -v -m "api and ci"
        working-directory: ${{ github.workspace }}/integration-test
        env:
          MA_API_SERVER: localhost:15566
          PYTHONPATH: ${{ github.workspace }}/integration-test

      - name: Wait for worker to connect to Cadence
        # --since=300s so a long-running earlier step can't age the startup
        # log out of the window before this loop even starts checking.
        run: |
          echo "Waiting for worker to establish Cadence connection..."
          for i in $(seq 1 30); do
            if kubectl logs deployment/michelangelo-worker --since=300s 2>/dev/null \
                | grep -q "Started Activity Worker"; then
              echo "Worker connected to Cadence."
              exit 0
            fi
            echo "  attempt $i/30, retrying in 10s..."
            sleep 10
          done
          echo "WARNING: worker did not confirm Cadence connection after 300s, proceeding anyway"

      - name: Run CLI e2e tests
        run: |
          $GITHUB_WORKSPACE/python/.venv/bin/pytest \
            functional/cli/test_cli.py \
            -v -m "cli"
        working-directory: ${{ github.workspace }}/integration-test
        env:
          MA_API_SERVER: localhost:15566
          MA_NAMESPACE: ma-dev-test
          MICHELANGELO_PYTHON_DIR: ${{ github.workspace }}/python
          PYTHONPATH: ${{ github.workspace }}/integration-test

      - name: Run michelangelo-examples CLI e2e tests
        run: |
          $GITHUB_WORKSPACE/python/.venv/bin/pytest \
            functional/cli/test_examples_repo_cli.py \
            -v -m "cli"
        working-directory: ${{ github.workspace }}/integration-test
        env:
          MA_API_SERVER: localhost:15566
          MICHELANGELO_EXAMPLES_DIR: ${{ github.workspace }}/michelangelo-examples
          PYTHONPATH: ${{ github.workspace }}/integration-test

      - name: Seed browser test data
        # Project + pipeline only (not models/deployments) - that's all the
        # browser tests reference. Both calls are cheap no-ops if the data
        # already exists from a prior run.
        run: |
          $GITHUB_WORKSPACE/python/.venv/bin/python -c "
          from functional.api.check_prerequisites import check_project, check_pipeline
          from fixtures.common_fixture import PIPELINE_RUN_CRUD_PIPELINE_NAME
          check_project()
          check_pipeline(PIPELINE_RUN_CRUD_PIPELINE_NAME)"
        working-directory: ${{ github.workspace }}/integration-test
        env:
          MA_API_SERVER: localhost:15566
          PYTHONPATH: ${{ github.workspace }}/integration-test

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0

      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
        working-directory: ${{ github.workspace }}/integration-test/browser

      - name: Run browser tests
        run: npm test
        working-directory: ${{ github.workspace }}/integration-test/browser
        env:
          MA_UI_URL: http://localhost:8090

      - name: Run retrain local and remote e2e
        run: ../.github/scripts/retrain-integration-test.sh
        env:
          MA_API_SERVER: localhost:15566
          MA_NAMESPACE: default
          RETRAIN_IMAGE_TAG: ${{ inputs.image_tag }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: integration-test/browser/playwright-report/
          retention-days: 7

      # Infrastructure is intentionally kept running between CI runs.
