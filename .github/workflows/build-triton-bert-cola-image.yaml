name: Build Triton bert_cola serving image

# Builds the custom Triton image used to serve the bert_cola demo model --
# the stock nvcr.io/nvidia/tritonserver image has no torch/transformers, which
# the custom python-backend package (examples/bert_cola/assembler.py) needs at
# load time. Single-arch (linux/amd64) since it's only used against the
# scala-hello-test sandbox cluster's amd64 nodes; manual trigger since the
# base image + pinned deps rarely change.
on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/tritonserver-bert-cola

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=23.04-py3-torch
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./python/examples/bert_cola/deploy
          file: ./python/examples/bert_cola/deploy/Dockerfile.triton
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
