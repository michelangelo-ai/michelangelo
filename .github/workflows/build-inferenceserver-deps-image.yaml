name: Build InferenceServer dependency image

# Dispatched by go/components/inferenceserver/depsimage.TriggerBuild (via the
# InferenceServer controller, not by a human) whenever an InferenceServer
# declares a ServingSpec.python_dependencies list that hasn't been built into
# an image yet. One image per distinct dependency set, tagged by content hash
# -- see depsimage.Tag -- shared by every InferenceServer, from any project,
# that declares the same dependencies. Not triggered by push/PR: there's no
# project directory or file to watch, only whatever dependency list the
# controller passes in.
on:
  workflow_dispatch:
    inputs:
      dependencies:
        description: "Newline-separated pip requirement strings"
        required: true
      tag:
        description: "Content-hash tag computed by depsimage.Tag -- must match what the controller expects, or it will never see this build as done"
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/inferenceserver-deps

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/inferenceserver-deps.Dockerfile
          platforms: linux/amd64
          build-args: |
            PYTHON_DEPENDENCIES=${{ inputs.dependencies }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.tag }}
          push: true
