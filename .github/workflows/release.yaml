# Build and upload release when a version tag (a tag starting with v) is pushed
name: build-release
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}
jobs:
  release-preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate release tag and versions
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_TYPE" != 'tag' ]]; then
            echo "Release builds require a tag ref, got $GITHUB_REF_TYPE $GITHUB_REF_NAME" >&2
            exit 1
          fi

          version="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_NAME" != v* || ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid Michelangelo release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi

          source_version="$(awk '$1 == "version:" {gsub(/"/, "", $2); print $2; exit}' helm/michelangelo/Chart.yaml)"
          if [[ "$version" != "$source_version" ]]; then
            echo "Release tag $version does not match source version $source_version" >&2
            exit 1
          fi

          bash scripts/version-bump.sh --check

  build-upload:
    needs: release-preflight
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ./python
    steps:
      #----------------------------------------------
      #  Checkout repository first (required for local actions)
      #----------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for git operations
      #----------------------------------------------
      #  Setup Python and Poetry using composite action
      #----------------------------------------------
      - name: Setup Python and Poetry
        uses: ./.github/actions/setup-python-poetry
        with:
          working-directory: './python'
      #----------------------------------------------
      #  Normalize the git tag to a PEP 440 version
      #  (poetry-dynamic-versioning enforces PEP 440, so
      #  SemVer pre-release tags like v0.4.0-rc.1 must be
      #  converted to 0.4.0rc1 before build/publish)
      #----------------------------------------------
      - name: Normalize version for PyPI (PEP 440)
        id: pep440
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [[ "$TAG" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-rc\.([0-9]+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}rc${BASH_REMATCH[2]}"
          else
            VERSION="$TAG"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Set poetry version
        run: poetry version "${{ steps.pep440.outputs.version }}"
      #----------------------------------------------
      #  Build the wheel file
      #----------------------------------------------
      - run: |
          poetry build -f wheel
        env:
          POETRY_DYNAMIC_VERSIONING_BYPASS: ${{ steps.pep440.outputs.version }}
      #----------------------------------------------
      #  Publish to PyPI
      #----------------------------------------------
      - name: Configure PyPI token
        run: poetry config pypi-token.pypi ${{ secrets.PYPI_API_TOKEN }}
      - name: Publish to PyPI
        run: poetry publish --no-interaction
        env:
          POETRY_DYNAMIC_VERSIONING_BYPASS: ${{ steps.pep440.outputs.version }}
      #----------------------------------------------
      #  Upload the wheel file to the release
      #----------------------------------------------
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          files: python/dist/*.whl

  build-go-binaries:
    needs: release-preflight
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [apiserver, worker, controllermgr]
        os: [linux, darwin]
        arch: [amd64, arm64]
    defaults:
      run:
        working-directory: go
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Build binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
          BIN: ${{ github.workspace }}/${{ matrix.service }}-${{ matrix.os }}-${{ matrix.arch }}
        run: go build -o "$BIN" ./cmd/${{ matrix.service }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ matrix.service }}-${{ matrix.os }}-${{ matrix.arch }}
          retention-days: 1

  upload-binaries:
    needs: build-go-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: binaries
          merge-multiple: true

      - name: Generate SHA-256 checksums
        run: |
          cd binaries
          sha256sum ./* > checksums-sha256.txt

      - name: Attach binaries and checksums to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          files: binaries/*

  helm-publish:
    needs: release-preflight
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Log in to GHCR
        run: |
          helm registry login ghcr.io \
            -u ${{ github.actor }} \
            -p ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Add Helm dependency repos
        run: |
          helm repo add cadence https://cadence-workflow.github.io/cadence-charts
          helm repo add temporal https://go.temporal.io/helm-charts
          helm repo update

      - name: Build Helm dependencies
        run: helm dependency build helm/michelangelo

      - name: Package Helm chart
        run: |
          helm package helm/michelangelo \
            --version ${{ steps.version.outputs.VERSION }} \
            --app-version ${{ steps.version.outputs.VERSION }}

      - name: Push chart to OCI registry
        run: |
          helm push \
            michelangelo-${{ steps.version.outputs.VERSION }}.tgz \
            oci://ghcr.io/michelangelo-ai/michelangelo/charts

  llm-gateway-helm-publish:
    needs: release-preflight
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/llm-gateway-chart-release.yml

  notify-on-failure:
    needs: [release-preflight, build-upload, build-go-binaries, upload-binaries, helm-publish, llm-gateway-helm-publish]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack on failure
        uses: slackapi/slack-github-action@37ebaef184d7626c5f204ab8d3baff4262dd30f0 # v1.27.0
        with:
          channel-id: 'C0BER0RCQ8P'
          slack-message: |
            :x: *${{ github.workflow }}* failed for ${{ github.ref_name }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
