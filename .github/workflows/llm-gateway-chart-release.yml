name: Publish LLM gateway chart

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: llm-gateway-chart-${{ github.ref }}
  cancel-in-progress: false

env:
  CHART_DIR: helm/michelangelo-llm-gateway
  CHART_NAME: michelangelo-llm-gateway
  OCI_ROOT: oci://ghcr.io/michelangelo-ai/michelangelo/charts

jobs:
  publish:
    if: github.repository == 'michelangelo-ai/michelangelo'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: llm-gateway-chart-release
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: '3.17.0'

      - name: Log in to GHCR
        run: |
          echo "${{ github.token }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin
          echo "${{ github.token }}" | docker login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Validate release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_TYPE" != 'tag' ]]; then
            echo "Gateway publishing requires a tag ref, got $GITHUB_REF_TYPE $GITHUB_REF_NAME" >&2
            exit 1
          fi

          version="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_NAME" != v* || ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid Michelangelo release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi

          chart_version="$(awk '$1 == "version:" {gsub(/"/, "", $2); print $2; exit}' "$CHART_DIR/Chart.yaml")"
          app_version="$(awk '$1 == "appVersion:" {gsub(/"/, "", $2); print $2; exit}' "$CHART_DIR/Chart.yaml")"
          dependency_version="$(awk '$1 == "version:" {gsub(/"/, "", $2); print $2; exit}' "$CHART_DIR/Chart.lock")"
          runtime_repository="$(awk '$1 == "repository:" {print $2; exit}' "$CHART_DIR/values.yaml")"
          runtime_reference="$(awk '$1 == "tag:" {gsub(/"/, "", $2); print $2; exit}' "$CHART_DIR/values.yaml")"
          test_repository="$(awk '$1 == "tests:" {found=1; next} found && $1 == "repository:" {print $2; exit}' "$CHART_DIR/values.yaml")"
          test_reference="$(awk '$1 == "tests:" {found=1; next} found && $1 == "tag:" {gsub(/"/, "", $2); print $2; exit}' "$CHART_DIR/values.yaml")"

          runtime_tag="${runtime_reference%%@*}"
          runtime_digest="${runtime_reference#*@}"
          test_tag="${test_reference%%@*}"
          test_digest="${test_reference#*@}"

          test "$version" = "$chart_version"
          test "$dependency_version" = '1.85.1'
          test "$runtime_tag" = "v$app_version"
          [[ "$runtime_digest" =~ ^sha256:[a-fA-F0-9]{64}$ ]]
          [[ "$test_digest" =~ ^sha256:[a-fA-F0-9]{64}$ ]]

          {
            echo "version=$version"
            echo "app_version=$app_version"
            echo "runtime_repository=$runtime_repository"
            echo "runtime_tag=$runtime_tag"
            echo "runtime_digest=$runtime_digest"
            echo "test_repository=$test_repository"
            echo "test_tag=$test_tag"
            echo "test_digest=$test_digest"
          } >> "$GITHUB_OUTPUT"

      - name: Build dependency
        run: helm dependency build "$CHART_DIR"

      - name: Install kubeconform
        run: |
          archive=/tmp/kubeconform-linux-amd64.tar.gz
          curl --fail --location --silent --show-error \
            --output "$archive" \
            https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          echo "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  $archive" | sha256sum --check
          tar --extract --gzip --file "$archive" --directory /tmp kubeconform
          sudo install --mode 0755 /tmp/kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: Validate chart
        run: bash .github/scripts/validate-llm-gateway-chart.sh

      - name: Verify image manifests
        env:
          RUNTIME_REPOSITORY: ${{ steps.metadata.outputs.runtime_repository }}
          RUNTIME_TAG: ${{ steps.metadata.outputs.runtime_tag }}
          RUNTIME_DIGEST: ${{ steps.metadata.outputs.runtime_digest }}
          TEST_REPOSITORY: ${{ steps.metadata.outputs.test_repository }}
          TEST_TAG: ${{ steps.metadata.outputs.test_tag }}
          TEST_DIGEST: ${{ steps.metadata.outputs.test_digest }}
        shell: bash
        run: |
          set -euo pipefail

          verify_image() {
            local repository="$1"
            local tag="$2"
            local expected_digest="$3"
            local output
            local actual_digest

            output="$(docker buildx imagetools inspect "$repository:$tag")"
            if [[ "$output" =~ Digest:[[:space:]]+(sha256:[a-fA-F0-9]{64}) ]]; then
              actual_digest="${BASH_REMATCH[1]}"
            else
              echo "Could not resolve digest for $repository:$tag" >&2
              exit 1
            fi
            test "$actual_digest" = "$expected_digest"
            [[ "$output" == *'linux/amd64'* ]]
            [[ "$output" == *'linux/arm64'* ]]
          }

          verify_image "$RUNTIME_REPOSITORY" "$RUNTIME_TAG" "$RUNTIME_DIGEST"
          verify_image "$TEST_REPOSITORY" "$TEST_TAG" "$TEST_DIGEST"

      - name: Package
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          APP_VERSION: ${{ steps.metadata.outputs.app_version }}
        run: |
          mkdir -p /tmp/llm-gateway-package
          helm package "$CHART_DIR" --destination /tmp/llm-gateway-package
          package="/tmp/llm-gateway-package/$CHART_NAME-$VERSION.tgz"
          test "$(helm show chart "$package" | awk '$1 == "appVersion:" {gsub(/"/, "", $2); print $2; exit}')" = "$APP_VERSION"
          package_contents="$(tar tzf "$package")"
          [[ "$package_contents" == *'charts/litellm-helm/Chart.yaml'* ]]

      - name: Check existing package
        id: package-state
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        shell: bash
        run: |
          set +e
          check_output="$(helm show chart "$OCI_ROOT/$CHART_NAME" --version "$VERSION" 2>&1)"
          check_status=$?
          set -e

          if [[ "$check_status" -eq 0 ]]; then
            local_root=/tmp/llm-gateway-local
            remote_root=/tmp/llm-gateway-remote
            remote_package=/tmp/llm-gateway-existing
            mkdir -p "$local_root" "$remote_root" "$remote_package"
            tar xzf "/tmp/llm-gateway-package/$CHART_NAME-$VERSION.tgz" -C "$local_root"
            helm pull "$OCI_ROOT/$CHART_NAME" --version "$VERSION" --destination "$remote_package"
            tar xzf "$remote_package/$CHART_NAME-$VERSION.tgz" -C "$remote_root"
            diff --recursive --brief "$local_root/$CHART_NAME" "$remote_root/$CHART_NAME"
            echo "Chart version $VERSION is already published with matching content."
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$check_output" != *'not found'* && "$check_output" != *'manifest unknown'* ]]; then
            echo "$check_output" >&2
            exit "$check_status"
          fi
          echo 'publish=true' >> "$GITHUB_OUTPUT"

      - name: Push
        if: steps.package-state.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          helm push \
            "/tmp/llm-gateway-package/$CHART_NAME-$VERSION.tgz" \
            "$OCI_ROOT"
