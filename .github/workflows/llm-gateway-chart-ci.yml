name: LLM gateway chart

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/scripts/validate-llm-gateway-chart.sh'
      - '.github/workflows/llm-gateway-chart-ci.yml'
      - '.github/workflows/llm-gateway-chart-release.yml'
      - 'helm/michelangelo-llm-gateway/**'
  push:
    branches:
      - main
    paths:
      - '.github/scripts/validate-llm-gateway-chart.sh'
      - '.github/workflows/llm-gateway-chart-ci.yml'
      - '.github/workflows/llm-gateway-chart-release.yml'
      - 'helm/michelangelo-llm-gateway/**'

permissions:
  contents: read
  packages: read

jobs:
  validate:
    name: Helm ${{ matrix.helm-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        helm-version:
          - '3.17.0'
          - '4.1.0'

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: ${{ matrix.helm-version }}

      - name: Log in to GHCR
        run: |
          echo "${{ github.token }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Build dependency
        run: helm dependency build helm/michelangelo-llm-gateway

      - name: Validate
        run: bash .github/scripts/validate-llm-gateway-chart.sh

      - name: Check shell
        run: shellcheck .github/scripts/validate-llm-gateway-chart.sh

      - name: Check workflows
        if: matrix.helm-version == '3.17.0'
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 \
            .github/workflows/llm-gateway-chart-ci.yml \
            .github/workflows/llm-gateway-chart-release.yml
