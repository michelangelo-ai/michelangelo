apiVersion: apps/v1
kind: Deployment
metadata:
  name: triton-inference-server-example
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: triton-inference-server-example
  template:
    metadata:
      labels:
        app: triton-inference-server-example
    spec:
      containers:
      - name: triton
        image: python:3.11-slim
        command: ["python", "-u", "-c"]
        args:
        - |
          from http.server import BaseHTTPRequestHandler, HTTPServer

          class Handler(BaseHTTPRequestHandler):
              def respond(self):
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.end_headers()
                  self.wfile.write(b"{}")

              def do_GET(self):
                  self.respond()

              def do_POST(self):
                  self.respond()

              def log_message(self, format, *args):
                  print(format % args)

          HTTPServer(("0.0.0.0", 8000), Handler).serve_forever()
        ports:
        - name: http
          containerPort: 8000
        readinessProbe:
          httpGet:
            path: /v2/health/ready
            port: http
          periodSeconds: 2
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: inference-server-example-inference-service
  namespace: default
spec:
  selector:
    app: triton-inference-server-example
  ports:
  - name: http
    port: 80
    targetPort: http
